<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WKYスケジュール</title>
<style>
  :root{
    --bg:#F7F9F6;
    --panel:#FFFFFF;
    --ink:#22282F;
    --sub-ink:#6B7480;
    --line:#E4E9E2;
    --accent:#F5841F;
    --accent-dark:#237A4E;
    --accent-ink:#FFFFFF;
    --sunday:#D64545;
    --saturday:#237A4E;
    --pastel-orange:#FCDDB0;
    --pastel-orange-ink:#7A4A12;
    --pastel-red:#F7C6C2;
    --pastel-red-ink:#8A2A22;
    --pastel-green:#C8E9D2;
    --pastel-green-ink:#1F5D3B;
    --id-work:#22282F;
    --id-p1:#2E9E5B;
    --id-p2:#E0483E;
    --id-p3:#F5841F;
    --id-p4:#6B7480;
    --pale-brown:#FBF2E7;
    --pastel-brown:#D9B98C;
    --pastel-brown-ink:#8A6A3F;
    --pastel-brown-bg:#F0DFC4;
    --label-col-w:52px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    height:100dvh; height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    background:var(--accent-dark);
    color:var(--accent-ink);
    padding:8px 10px 6px;
    border-radius:0 0 18px 18px;
  }
  .title-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
  }
  .title-row h1{
    display:inline-flex;align-items:center;gap:5px;
    font-size:14.5px;margin:0;font-weight:800;letter-spacing:.02em;
    color:var(--accent-dark);
    background:#FFFFFF;
    padding:5px 12px 5px 10px;
    border-radius:999px;
    border:2px solid var(--pastel-green);
    box-shadow:2px 2px 0 var(--pastel-orange);
  }
  .title-row h1::before{
    content:"\2606";
    color:var(--pastel-red-ink);
    font-size:12px;
  }
  .title-row h1::after{
    content:"\2606";
    color:var(--pastel-green-ink);
    font-size:12px;
  }
  .sync-dot{
    width:7px;height:7px;border-radius:50%;background:#7CD98B;
    display:inline-block;margin-right:5px;
    box-shadow:0 0 0 0 rgba(124,217,139,.6);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(124,217,139,.5);}
    70%{box-shadow:0 0 0 5px rgba(124,217,139,0);}
    100%{box-shadow:0 0 0 0 rgba(124,217,139,0);}
  }
  .sync-label{font-size:10px;color:#D7E6F0;font-weight:400;}
  .mode-row{
    display:flex;gap:6px;margin-bottom:6px;
  }
  .mode-btn{
    flex:1;padding:7px 4px;border:none;border-radius:14px;
    background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;
    cursor:pointer;
  }
  .mode-btn.active{background:#fff;color:var(--accent-dark);}
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .nav-btn{
    border:none;background:rgba(255,255,255,.14);color:#fff;
    width:30px;height:28px;border-radius:14px;font-size:15px;cursor:pointer;
  }
  .month-label{font-size:14.5px;font-weight:700;flex:1;text-align:center;}
  .today-btn{
    border:none;background:var(--accent);color:#fff;
    padding:0 10px;height:28px;border-radius:14px;font-size:11.5px;cursor:pointer;font-weight:700;
  }
  .settings-btn{
    border:none;background:rgba(255,255,255,.14);color:#fff;
    width:28px;height:28px;border-radius:14px;font-size:13px;cursor:pointer;
  }
  /* ---------- Unread info panel ---------- */
  .unread-panel{
    flex:0 0 auto;background:var(--pastel-orange);border-bottom:1px solid var(--line);
    padding:8px 10px;
  }
  .unread-panel.hidden{display:none;}
  .unread-panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .unread-panel-title{font-size:12px;font-weight:800;color:var(--pastel-orange-ink);}
  .unread-confirm-btn{
    flex:0 0 auto;border:none;background:#fff;color:var(--pastel-orange-ink);
    font-size:11px;font-weight:700;padding:5px 12px;border-radius:14px;cursor:pointer;
  }
  .unread-list{
    list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;
  }
  .unread-list li{
    font-size:11.5px;color:var(--pastel-orange-ink);background:#fff;
    border-radius:10px;padding:6px 9px;line-height:1.4;word-break:break-word;
  }
  /* ---------- Settings panel ---------- */
  #settingsPanel{
    flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    padding:8px 10px;display:none;border-radius:0 0 16px 16px;
  }
  #settingsPanel.open{display:block;}
  .logout-btn{
    margin-top:12px;border:1px solid var(--sunday);background:#fff;color:var(--sunday);
    font-size:12px;font-weight:700;padding:8px 14px;border-radius:14px;cursor:pointer;width:100%;
  }
  .settings-title{font-size:11px;color:var(--sub-ink);margin-bottom:6px;font-weight:600;}
  .person-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .person-inputs input{
    border:1px solid var(--line);border-radius:12px;padding:6px 9px;font-size:12.5px;
    color:var(--ink);background:#fafbfc;min-width:0;
  }
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:10.5px;color:var(--sub-ink);}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .swatch{width:10px;height:10px;border-radius:5px;display:inline-block;}
  .id-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .id-legend span{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--sub-ink);}
  .id-swatch{width:13px;height:13px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:7.5px;font-weight:800;}

  /* ---------- Month view ---------- */
  #viewMonth{flex:1 1 auto;display:none;overflow:hidden;flex-direction:column;}
  #viewMonth.active{display:flex;}
  .weekday-row{
    display:grid;grid-template-columns:repeat(7,1fr);
    background:var(--panel);border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .weekday-row div{
    text-align:center;font-size:10.5px;padding:4px 0;color:var(--sub-ink);font-weight:600;
  }
  .weekday-row div.sun{color:var(--sunday);}
  .weekday-row div.sat{color:var(--saturday);}
  #monthGrid{
    flex:1 1 auto;display:grid;grid-template-columns:repeat(7,1fr);
    background:#ECDCC6;row-gap:9px;column-gap:3px;overflow-y:auto;overflow-x:hidden;
    padding:2px;-webkit-overflow-scrolling:touch;
  }
  .day-cell{
    background:var(--panel);display:flex;flex-direction:column;
    padding:5px 3px 6px;overflow:visible;min-width:0;
    border-radius:10px;
  }
  .day-cell.empty{background:#EAEDF0;}
  .day-cell.holiday{border-top:3px solid var(--sunday);padding-top:3px;border-radius:10px;}
  .day-num{
    font-size:12px;font-weight:700;color:var(--ink);line-height:1.15;padding-bottom:3px;
  }
  .day-num.sun{color:var(--sunday);}
  .day-num.sat{color:var(--saturday);}
  .day-num.holiday{
    display:inline-block;background:var(--sunday);color:#fff;border-radius:50%;
    width:19px;height:19px;text-align:center;line-height:19px;font-size:10.5px;
  }
  .day-num.today{
    display:inline-block;background:var(--accent);color:#fff;border-radius:50%;
    width:19px;height:19px;text-align:center;line-height:19px;font-size:10.5px;
  }
  .mini-row{
    display:flex;align-items:stretch;gap:3px;margin-top:4px;min-width:0;
  }
  .mini-row.divider-brown{
    margin-top:6px;padding-top:6px;
    border-top:2px dashed var(--pastel-brown);
    position:relative;
  }
  .mini-label{
    flex:0 0 auto;width:17px;border-radius:8px;
    font-size:10px;font-weight:800;color:#fff;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .mini-label-work{
    background:none;color:var(--ink);font-weight:800;font-size:13px;
  }
  .mini-select{
    width:100%;flex:1 1 auto;min-width:0;border:none;border-radius:10px;background:#F5F6F7;color:var(--ink);
    font-size:12.5px;padding:6px 2px;text-align:center;
    appearance:none;-webkit-appearance:none;
    font-family:inherit;line-height:1.25;
  }
  .mini-select.c-orange{background:var(--pastel-orange);color:var(--pastel-orange-ink);font-weight:700;}
  .mini-select.c-red{background:var(--pastel-red);color:var(--pastel-red-ink);font-weight:700;}
  .mini-select.c-green{background:var(--pastel-green);color:var(--pastel-green-ink);font-weight:700;}


  /* ---------- Week view ---------- */
  #viewWeek{flex:1 1 auto;display:none;flex-direction:column;overflow:hidden;}
  #viewWeek.active{display:flex;}
  .week-scroll{
    flex:1 1 auto;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
  }
  table.week-table{border-collapse:separate;border-spacing:2px;table-layout:fixed;width:max-content;}
  .day-col-cell{
    width:calc((100vw - var(--label-col-w))/7);
    min-width:calc((100vw - var(--label-col-w))/7);
    border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    padding:3px 2px;vertical-align:top;
    border-radius:8px;
  }
  .weekstart{scroll-snap-align:start;}
  .sticky-col{
    position:sticky;left:0;z-index:3;background:var(--panel);
    width:var(--label-col-w);min-width:var(--label-col-w);max-width:var(--label-col-w);
    border-right:2px solid var(--line);border-bottom:1px solid var(--line);
    font-size:10px;font-weight:700;color:var(--sub-ink);text-align:center;
    padding:4px 2px;white-space:normal;word-break:break-all;
    border-radius:8px;
  }
  thead .sticky-col{z-index:4;background:var(--panel);}
  thead td, thead th{background:var(--panel);}
  .col-header{text-align:center;}
  .col-weekday{font-size:9.5px;color:var(--sub-ink);font-weight:700;}
  .col-weekday.sun{color:var(--sunday);}
  .col-weekday.sat{color:var(--saturday);}
  .col-date{font-size:12px;font-weight:700;}
  .col-date.sun-date{color:var(--sunday);}
  .col-date.today{color:var(--accent);}
  .col-holiday{
    font-size:6.8px;color:var(--sunday);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%;line-height:1.2;
  }
  .wk-select{
    width:100%;border:none;border-radius:9px;background:#F5F6F7;color:var(--ink);
    font-size:10.5px;padding:4px 0;text-align:center;text-align-last:center;
    -moz-text-align-last:center;font-family:inherit;
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    margin-bottom:2px;font-weight:600;text-indent:0;
  }
  .wk-select option{text-align:center;}
  .wk-select.c-orange{background:var(--pastel-orange);color:var(--pastel-orange-ink);}
  .wk-select.c-red{background:var(--pastel-red);color:var(--pastel-red-ink);}
  .wk-select.c-green{background:var(--pastel-green);color:var(--pastel-green-ink);}
  .wk-note{
    width:100%;height:46px;border:1px solid var(--line);border-radius:9px;
    font-size:9.5px;padding:3px;font-family:inherit;resize:none;background:#fafbfc;
    color:var(--ink);
  }
  .row-th{font-size:9.5px;}
  .wk-row-p1 .sticky-col{background:#ffffff;color:var(--pastel-green-ink);}
  .wk-row-p2 .sticky-col{background:#ffffff;color:var(--pastel-green-ink);}
  .wk-row-p3 .sticky-col{background:#ffffff;color:var(--pastel-green-ink);}
  .wk-row-p4 .sticky-col{background:#ffffff;color:var(--pastel-green-ink);}
  .wk-row-work .sticky-col{background:#ffffff;color:var(--pastel-orange-ink);font-weight:800;font-size:14px;}
  .wk-row-note .sticky-col{background:#ffffff;color:var(--pastel-orange-ink);}
  .wk-row-work .sticky-col,
  .wk-row-work .day-col-cell{
    border-top:3px dashed var(--pastel-red);
    padding-top:6px;
  }

  /* ---------- WKY schedule panel (week view) ---------- */
  #wkyPanel{
    flex:0 0 40%;display:flex;flex-direction:column;
    border-top:2px solid var(--line);background:var(--panel);overflow:hidden;
  }
  .wky-form-header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border-bottom:1px solid var(--line);background:#f7e5c2;
  }
  .wky-form-toggle{
    flex:0 0 auto;border:none;background:#ffffff;color:brown;
    width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease;
  }
  .wky-form-toggle.open{transform:rotate(180deg);}
  .wky-form{
    flex:0 0 auto;padding:8px 10px 6px;border-bottom:1px solid var(--line);background:#f7e5c2;
  }
  .wky-form.collapsed{display:none;}
  .wky-form-title{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:800;color:brown;
    background:#ffffff;
    padding:4px 12px;border-radius:999px;
  }
  .wky-form-title::before{content:"\1F4DD";font-size:11px;}
  .wky-form-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start;}
  .wky-form-row:last-child{margin-bottom:0;align-items:center;}
  .wky-date-group{display:flex;flex-direction:column;flex:1;min-width:0;gap:3px;}
  .wky-form-row input[type="date"]{
    flex:1;min-width:0;border:1px solid var(--pastel-brown);border-radius:12px;
    padding:6px 4px;font-size:12px;font-family:inherit;color:var(--pastel-brown-ink);background:#fff;
  }
  .wky-weekday{
    display:none;
  }
  .wky-form-row .sep{font-size:11px;color:var(--pastel-brown-ink);flex:0 0 auto;padding-top:7px;}
  .wky-form-row input[type="text"]{
    flex:1;min-width:0;border:1px solid var(--pastel-brown);border-radius:12px;
    padding:7px 8px;font-size:12.5px;font-family:inherit;color:var(--pastel-brown-ink);background:#fff;
  }
  #wkyAddBtn{
    flex:0 0 auto;border:none;background:var(--accent);color:#fff;font-weight:700;
    font-size:12.5px;padding:0 14px;height:32px;border-radius:16px;cursor:pointer;
  }
  .wky-list-wrap{flex:1 1 auto;overflow-y:auto;padding:6px 10px 10px;background:#ffb1a3;}
  .wky-list-title{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:800;color:red;
    background:#ffffff;
    padding:5px 12px;border-radius:12px;
    margin:4px 0 8px;position:sticky;top:0;left:0;
  }
  .wky-list-title::before{content:"\1F4C5";font-size:10.5px;}
  .wky-empty{font-size:11.5px;color:var(--pastel-red-ink);padding:8px 2px;}
  .wky-item{
    display:flex;align-items:center;gap:8px;padding:7px 6px;
    border:1px solid var(--pastel-red-ink);border-radius:14px;background:#fff;margin-bottom:6px;
  }
  .wky-item-period{
    flex:0 0 auto;font-size:11px;font-weight:700;color:var(--pastel-orange-ink);
    background:none;padding:3px 6px;border-radius:10px;white-space:nowrap;
  }
  .wky-item-detail{flex:1 1 auto;font-size:12px;color:var(--ink);word-break:break-word;line-height:1.35;}
  .wky-del{
    flex:0 0 auto;border:none;background:var(--pastel-red);color:var(--pastel-red-ink);
    width:22px;height:22px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1;font-weight:700;
  }
  #loginOverlay{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #loginOverlay.hidden{display:none;}
  .login-card{
    background:var(--panel);border-radius:16px;padding:28px 22px;width:100%;max-width:340px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
  }
  .login-card h2{margin:0 0 4px;font-size:16px;color:var(--ink);}
  .login-card p{margin:0 0 18px;font-size:12px;color:var(--sub-ink);}
  .login-field{margin-bottom:12px;}
  .login-field label{display:block;font-size:11px;color:var(--sub-ink);margin-bottom:4px;}
  .login-field input{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;font-family:inherit;background:#fafbfc;color:var(--ink);
  }
  .login-btn{
    width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .login-btn:disabled{opacity:.6;}
  .login-error{color:var(--sunday);font-size:11.5px;margin-top:10px;min-height:14px;}
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="login-card">
    <h2>ログイン</h2>
    <p>共有スケジュールを見るにはログインしてください。</p>
    <div class="login-field">
      <label for="loginEmail">メールアドレス</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="login-field">
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">ログイン</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div id="app" style="display:none;">


  <header>
    <div class="title-row">
      <h1>WKYスケジュール</h1>
      <span class="sync-label"><span class="sync-dot"></span>共有中</span>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="btnMonth">月間表示</button>
      <button class="mode-btn" id="btnWeek">週間表示</button>
      <button class="settings-btn" id="btnSettings" title="担当者名を編集">⚙</button>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">‹</button>
      <div class="month-label" id="monthLabel">-</div>
      <button class="nav-btn" id="nextBtn">›</button>
      <button class="today-btn" id="todayBtn">今日</button>
    </div>
  </header>

  <div id="unreadPanel" class="unread-panel hidden">
    <div class="unread-panel-head">
      <span class="unread-panel-title">🔔 未確認の最新情報</span>
      <button id="unreadConfirmBtn" class="unread-confirm-btn">確認した</button>
    </div>
    <ul id="unreadList" class="unread-list"></ul>
  </div>

  <div id="settingsPanel">
    <div class="settings-title">担当者名を入力（4名）</div>
    <div class="person-inputs">
      <input type="text" id="p0" placeholder="担当者1" maxlength="10">
      <input type="text" id="p1" placeholder="担当者2" maxlength="10">
      <input type="text" id="p2" placeholder="担当者3" maxlength="10">
      <input type="text" id="p3" placeholder="担当者4" maxlength="10">
    </div>
    <div class="settings-title" style="margin-top:8px;">担当ラベルの色（月間カレンダーの左端に表示）</div>
    <div class="id-legend" id="idLegend"></div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--pastel-orange)"></span>仕事／W</span>
      <span><span class="swatch" style="background:var(--pastel-red)"></span>休</span>
      <span><span class="swatch" style="background:var(--pastel-green)"></span>泊明</span>
    </div>
    <button id="logoutBtn" class="logout-btn">ログアウト</button>
  </div>

  <div id="viewMonth" class="active">
    <div class="weekday-row" id="weekdayRow"></div>
    <div id="monthGrid"></div>
  </div>

  <div id="viewWeek">
    <div class="week-scroll" id="weekScroll">
      <table class="week-table">
        <thead>
          <tr id="weekHeaderRow"></tr>
        </thead>
        <tbody id="weekBody"></tbody>
      </table>
    </div>

    <div id="wkyPanel">
      <div class="wky-form-header" id="wkyFormHeader">
        <div class="wky-form-title">ＷＫＹスケジュールを追加</div>
        <button class="wky-form-toggle" id="wkyFormToggle" aria-expanded="false" aria-controls="wkyFormBody">▼</button>
      </div>
      <div class="wky-form collapsed" id="wkyFormBody">
        <div class="wky-form-row">
          <div class="wky-date-group">
            <input type="date" id="wkyStart">
            <span class="wky-weekday" id="wkyStartWeekday"></span>
          </div>
          <span class="sep">〜</span>

            <input type="date" id="wkyEnd">
            <span class="wky-weekday" id="wkyEndWeekday"></span>
          </div>
        </div>
        <div class="wky-form-row">
          <input type="text" id="wkyDetail" placeholder="スケジュールの詳細を入力">
          <button id="wkyAddBtn">追加</button>
        </div>

      <div class="wky-list-wrap">
        <div class="wky-list-title">ＷＫＹスケジュール一覧</div>
        <div id="wkyList"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- Firebase config ----------------
  // Firebase コンソール（https://console.firebase.google.com/）でプロジェクトを作成し、
  // 「プロジェクトの設定」→「マイアプリ」→ ウェブアプリ を追加すると下記の値が発行されます。
  // Realtime Database を有効化してから、下の値をご自身のものに置き換えてください。
  var firebaseConfig = {
    apiKey: "AIzaSyAEkPMtbIkbUmk4ISBWUzSBwCkrrkO7X6E",
    authDomain: "kuma-car.firebaseapp.com",
    databaseURL: "https://kuma-car-default-rtdb.firebaseio.com",
    projectId: "kuma-car"
  };
  var firebaseReady = !!(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0);

  var STORAGE_KEY = 'schedule-config-v1';
  var PERSON_OPTIONS = ['休','泊明','W'];
  var WEEKDAY_JP = ['日','月','火','水','木','金','土'];

  var state = {
    persons: ['担当者1','担当者2','担当者3','担当者4'],
    entries: {}, // 'YYYY-MM-DD' -> {work:'', p:['','','',''], note:''}
    wkyList: [] // [{id, start:'YYYY-MM-DD', end:'YYYY-MM-DD', detail}]
  };

  var currentDate = new Date();
  currentDate.setDate(1);
  var viewMode = 'month';
  var saveTimer = null;
  var isDirty = false;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  // ---------------- Japanese national holidays ----------------
  var holidayCache = {};

  function nthMondayDate(year, month, n){
    var first = new Date(year, month, 1);
    var offset = (8 - first.getDay()) % 7;
    return 1 + offset + (n-1)*7;
  }

  function buildHolidayList(year){
    var list = [];
    function add(m, d, name){ list.push({date:new Date(year,m,d), name:name}); }

    add(0, 1, '元日');
    add(0, nthMondayDate(year,0,2), '成人の日');
    add(1, 11, '建国記念の日');
    if(year === 2019){
      // transition year between Heisei and Reiwa — no Emperor's Birthday holiday
    }else if(year >= 2020){
      add(1, 23, '天皇誕生日');
    }else{
      add(11, 23, '天皇誕生日');
    }
    var vernal = Math.floor(20.8431 + 0.242194*(year-1980)) - Math.floor((year-1980)/4);
    add(2, vernal, '春分の日');
    add(3, 29, '昭和の日');
    add(4, 3, '憲法記念日');
    add(4, 4, 'みどりの日');
    add(4, 5, 'こどもの日');
    add(6, nthMondayDate(year,6,3), '海の日');
    if(year >= 2016){
      add(7, 11, '山の日');
    }
    add(8, nthMondayDate(year,8,3), '敬老の日');
    var autumnal = Math.floor(23.2488 + 0.242194*(year-1980)) - Math.floor((year-1980)/4);
    add(8, autumnal, '秋分の日');
    add(9, nthMondayDate(year,9,2), year >= 2020 ? 'スポーツの日' : '体育の日');
    add(10, 3, '文化の日');
    add(10, 23, '勤労感謝の日');
    return list;
  }

  function computeHolidayMap(year){
    var list = buildHolidayList(year);
    var map = {};
    list.forEach(function(h){ map[dateKey(h.date)] = h.name; });

    // 振替休日: a holiday on Sunday pushes to the next non-holiday day
    list.forEach(function(h){
      if(h.date.getDay() === 0){
        var d = new Date(h.date);
        do{ d.setDate(d.getDate()+1); }while(map[dateKey(d)]);
        map[dateKey(d)] = '振替休日';
      }
    });

    // 国民の休日: a non-Sunday weekday sandwiched between two holidays becomes a holiday
    var d0 = new Date(year,0,1), d1 = new Date(year,11,31);
    for(var d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)){
      var key = dateKey(d);
      if(map[key] || d.getDay() === 0) continue;
      var prev = new Date(d); prev.setDate(prev.getDate()-1);
      var next = new Date(d); next.setDate(next.getDate()+1);
      if(map[dateKey(prev)] && map[dateKey(next)]){
        map[key] = '国民の休日';
      }
    }
    return map;
  }

  function getHolidayName(dateObj){
    var y = dateObj.getFullYear();
    if(!holidayCache[y]) holidayCache[y] = computeHolidayMap(y);
    return holidayCache[y][dateKey(dateObj)] || null;
  }

  function getEntry(key){
    if(!state.entries[key]){
      state.entries[key] = {work:'', p:['','','',''], note:''};
    }
    return state.entries[key];
  }

  function colorClass(val){
    if(val === 'ＷＫＹ' || val === 'W') return 'c-orange';
    if(val === '休') return 'c-red';
    if(val === '泊明') return 'c-green';
    return '';
  }

  // ---------------- Storage ----------------
  function migrateLegacyPersonValue(v){
    if(v === '法' || v === '公' || v === '有') return '休';
    if(v === '泊' || v === '明') return '泊明';
    return v;
  }

  function migrateLegacyEntries(){
    for(var key in state.entries){
      var e = state.entries[key];
      if(e && e.p){
        for(var i=0;i<e.p.length;i++){
          e.p[i] = migrateLegacyPersonValue(e.p[i]);
        }
      }
    }
  }

  var stateRef = null;
  var suppressNextRemote = false;
  var LOCAL_KEY = 'schedule-local-fallback-v1';

  function setSyncStatus(mode){
    // mode: 'sync' | 'local' | 'error'
    var dot = document.querySelector('.sync-dot');
    var label = document.querySelector('.sync-label');
    if(!dot || !label) return;
    if(mode === 'sync'){
      dot.style.background = '#7CD98B';
      label.textContent = '共有中';
    }else if(mode === 'local'){
      dot.style.background = '#F2C94C';
      label.textContent = '未設定（このブラウザのみ保存）';
    }else{
      dot.style.background = '#EB5757';
      label.textContent = '同期エラー';
    }
  }

  function applyIncomingState(parsed){
    if(parsed && parsed.persons && parsed.entries){
      state = parsed;
      if(!state.wkyList) state.wkyList = [];
      migrateLegacyEntries();
    }
  }

  function initFirebase(){
    if(!firebaseReady) return false;
    try{
      firebase.initializeApp(firebaseConfig);
      stateRef = firebase.database().ref(STORAGE_KEY);
      return true;
    }catch(e){
      console.error('firebase init failed', e);
      return false;
    }
  }

  function loadState(){
    if(!firebaseReady || !stateRef){
      // ローカル保存のみのフォールバック（Firebase未設定時）
      try{
        var raw = localStorage.getItem(LOCAL_KEY);
        if(raw) applyIncomingState(JSON.parse(raw));
      }catch(e){}
      setSyncStatus('local');
      return Promise.resolve();
    }
    return stateRef.once('value').then(function(snap){
      var val = snap.val();
      if(val) applyIncomingState(val);
      setSyncStatus('sync');
    }).catch(function(e){
      console.error('load failed', e);
      setSyncStatus('error');
    });
  }

  function saveStateNow(){
    if(!firebaseReady || !stateRef){
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }catch(e){}
      return Promise.resolve();
    }
    suppressNextRemote = true;
    return stateRef.set(state).then(function(){
      setSyncStatus('sync');
    }).catch(function(e){
      console.error('save failed', e);
      setSyncStatus('error');
    });
  }

  var pendingChangeDescription = null;
  var changeLogRef = null;
  var lastSeenRef = null;
  var lastSeenTs = 0;
  var unreadItems = [];

  function formatDateLabel(key){
    var parts = key.split('-');
    return parseInt(parts[1],10)+'/'+parseInt(parts[2],10);
  }

  function scheduleSave(description){
    isDirty = true;
    if(description) pendingChangeDescription = description;
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      saveStateNow().then(function(){
        isDirty = false;
        if(pendingChangeDescription){
          recordChange(pendingChangeDescription);
          pendingChangeDescription = null;
        }
      });
    }, 350);
  }

  function recordChange(summary){
    if(!firebaseReady || !changeLogRef) return;
    var user = firebase.auth().currentUser;
    var email = user ? user.email : '不明';
    changeLogRef.push({
      ts: firebase.database.ServerValue.TIMESTAMP,
      user: email,
      summary: summary
    });
    trimChangeLog();
  }

  function trimChangeLog(){
    changeLogRef.once('value').then(function(snap){
      var keys = [];
      snap.forEach(function(child){ keys.push(child.key); });
      if(keys.length > 150){
        var toRemove = keys.slice(0, keys.length - 150);
        toRemove.forEach(function(k){ changeLogRef.child(k).remove(); });
      }
    });
  }

  function renderUnreadPanel(){
    var panel = document.getElementById('unreadPanel');
    var list = document.getElementById('unreadList');
    if(!panel || !list) return;
    list.innerHTML = '';
    if(unreadItems.length === 0){
      panel.classList.add('hidden');
      return;
    }
    panel.classList.remove('hidden');
    unreadItems.forEach(function(item){
      var li = document.createElement('li');
      var d = new Date(item.ts);
      var timeStr = pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
      li.textContent = '['+timeStr+'] '+item.user+'：'+item.summary;
      list.appendChild(li);
    });
  }

  function attachChangeLogListener(){
    if(!firebaseReady) return;
    var user = firebase.auth().currentUser;
    if(!user) return;
    changeLogRef = firebase.database().ref('changeLog');
    lastSeenRef = firebase.database().ref('users/'+user.uid+'/lastSeenTs');
    lastSeenRef.once('value').then(function(snap){
      lastSeenTs = snap.val() || 0;
      changeLogRef.limitToLast(50).on('value', function(logSnap){
        var myEmail = user.email;
        var items = [];
        logSnap.forEach(function(child){
          var v = child.val();
          if(v && v.ts > lastSeenTs && v.user !== myEmail){
            items.push({ts:v.ts, user:v.user, summary:v.summary});
          }
        });
        items.sort(function(a,b){ return a.ts - b.ts; });
        unreadItems = items;
        renderUnreadPanel();
      });
    });
  }

  function confirmUnreadItems(){
    var maxTs = 0;
    unreadItems.forEach(function(item){ if(item.ts > maxTs) maxTs = item.ts; });
    if(maxTs > 0 && lastSeenRef){
      lastSeenTs = maxTs;
      lastSeenRef.set(maxTs);
    }
    unreadItems = [];
    renderUnreadPanel();
  }

  function isEditingSomething(){
    var el = document.activeElement;
    if(!el) return false;
    var tag = el.tagName;
    return tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'INPUT';
  }

  function attachRealtimeListener(){
    if(!firebaseReady || !stateRef) return;
    stateRef.on('value', function(snap){
      if(suppressNextRemote){ suppressNextRemote = false; return; }
      if(isDirty || isEditingSomething()) return;
      var val = snap.val();
      if(!val) return;
      var incoming = JSON.stringify(val);
      var current = JSON.stringify(state);
      if(incoming !== current){
        applyIncomingState(val);
        renderAll();
      }
    }, function(err){
      console.error('realtime listener error', err);
      setSyncStatus('error');
    });
  }

  // ---------------- Header / nav ----------------
  function monthLabel(d){
    return d.getFullYear()+'年 '+(d.getMonth()+1)+'月';
  }

  function updateHeader(){
    document.getElementById('monthLabel').textContent = monthLabel(currentDate);
    document.getElementById('btnMonth').classList.toggle('active', viewMode==='month');
    document.getElementById('btnWeek').classList.toggle('active', viewMode==='week');
    document.getElementById('viewMonth').classList.toggle('active', viewMode==='month');
    document.getElementById('viewWeek').classList.toggle('active', viewMode==='week');
  }

  // ---------------- Month view ----------------
  function buildWeekdayRow(){
    var row = document.getElementById('weekdayRow');
    row.innerHTML = '';
    WEEKDAY_JP.forEach(function(w,i){
      var div = document.createElement('div');
      div.textContent = w;
      if(i===0) div.className='sun';
      if(i===6) div.className='sat';
      row.appendChild(div);
    });
  }

  function buildMonthMatrix(year, month){
    var firstDay = new Date(year, month, 1);
    var startWeekday = firstDay.getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var cells = [];
    for(var i=0;i<startWeekday;i++) cells.push(null);
    for(var d=1; d<=daysInMonth; d++) cells.push(new Date(year,month,d));
    while(cells.length % 7 !== 0) cells.push(null);
    var weeks = [];
    for(var j=0;j<cells.length;j+=7) weeks.push(cells.slice(j,j+7));
    return weeks;
  }

  function makeSelectOptions(select, options, currentVal){
    var frag = document.createDocumentFragment();
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = '';
    frag.appendChild(blank);
    options.forEach(function(opt){
      var o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      frag.appendChild(o);
    });
    select.appendChild(frag);
    select.value = currentVal || '';
  }

  function applySelectColor(select, val){
    select.classList.remove('c-orange','c-red','c-green');
    var cls = colorClass(val);
    if(cls) select.classList.add(cls);
  }

  function renderMonthView(){
    buildWeekdayRow();
    var year = currentDate.getFullYear();
    var month = currentDate.getMonth();
    var weeks = buildMonthMatrix(year, month);
    var grid = document.getElementById('monthGrid');
    grid.innerHTML = '';
    grid.style.gridTemplateRows = 'repeat('+weeks.length+', auto)';

    var today = new Date();

    weeks.forEach(function(week){
      week.forEach(function(dateObj, idx){
        var cell = document.createElement('div');
        cell.className = 'day-cell';
        if(!dateObj){
          cell.classList.add('empty');
          grid.appendChild(cell);
          return;
        }
        var key = dateKey(dateObj);
        var entry = getEntry(key);
        var holidayName = getHolidayName(dateObj);
        if(holidayName){
          cell.classList.add('holiday');
          cell.title = holidayName;
        }

        var numDiv = document.createElement('div');
        var numSpan = document.createElement('span');
        numSpan.textContent = dateObj.getDate();
        numSpan.className = 'day-num' + (holidayName ? ' holiday' : (idx===0?' sun':(idx===6?' sat':''))) + (sameDay(dateObj,today)?' today':'');
        numDiv.appendChild(numSpan);
        cell.appendChild(numDiv);

        // work select
        var workRow = document.createElement('div');
        workRow.className = 'mini-row';
        var workLabel = document.createElement('div');
        workLabel.className = 'mini-label mini-label-work';
        workLabel.title = 'ＷＫＹ';
        workLabel.textContent = '\u{1F43B}';
        var workSel = document.createElement('select');
        workSel.className = 'mini-select';
        makeSelectOptions(workSel, ['ＷＫＹ'], entry.work);
        applySelectColor(workSel, entry.work);
        workSel.addEventListener('change', function(){
          getEntry(key).work = workSel.value;
          applySelectColor(workSel, workSel.value);
          scheduleSave(formatDateLabel(key)+' のＷＫＹ予定を変更');
          syncWeekCellIfVisible(key, 'work', null, workSel.value);
        });
        workRow.appendChild(workLabel);
        workRow.appendChild(workSel);
        cell.appendChild(workRow);

        // 4 person selects
        var PERSON_ID_COLORS = [
          {bg:'var(--pastel-green)', ink:'var(--pastel-green-ink)'},
          {bg:'var(--pastel-red)', ink:'var(--pastel-red-ink)'},
          {bg:'var(--pastel-orange)', ink:'var(--pastel-orange-ink)'},
          {bg:'#E7E9EA', ink:'var(--sub-ink)'}
        ];
        for(var pi=0; pi<4; pi++){
          (function(pi){
            var row = document.createElement('div');
            row.className = 'mini-row' + (pi===0 ? ' divider-brown' : '');
            var label = document.createElement('div');
            label.className = 'mini-label';
            label.style.background = PERSON_ID_COLORS[pi].bg;
            label.style.color = PERSON_ID_COLORS[pi].ink;
            var pname = state.persons[pi] || '';
            label.textContent = pname ? pname.charAt(0) : String(pi+1);
            var sel = document.createElement('select');
            sel.className = 'mini-select';
            makeSelectOptions(sel, PERSON_OPTIONS, entry.p[pi]);
            applySelectColor(sel, entry.p[pi]);
            sel.addEventListener('change', function(){
              getEntry(key).p[pi] = sel.value;
              applySelectColor(sel, sel.value);
              var pname2 = state.persons[pi] || ('担当者'+(pi+1));
              scheduleSave(formatDateLabel(key)+' の'+pname2+'の予定を変更');
              syncWeekCellIfVisible(key, 'p', pi, sel.value);
            });
            row.appendChild(label);
            row.appendChild(sel);
            cell.appendChild(row);
          })(pi);
        }

        grid.appendChild(cell);
      });
    });
  }

  // keep a lookup so month-view edits can live-update an already rendered week view without full rerender
  function syncWeekCellIfVisible(key, field, idx, val){
    if(viewMode !== 'week') return;
    var selector = field === 'work'
      ? '.wk-select[data-date="'+key+'"][data-field="work"]'
      : '.wk-select[data-date="'+key+'"][data-field="p"][data-idx="'+idx+'"]';
    var el = document.querySelector(selector);
    if(el){ el.value = val; applySelectColor(el, val); }
  }

  // ---------------- WKY schedule list ----------------
  function eachDateInRange(start, end, fn){
    var startDate = new Date(start+'T00:00:00');
    var endDate = new Date(end+'T00:00:00');
    for(var d = new Date(startDate); d <= endDate; d.setDate(d.getDate()+1)){
      fn(dateKey(d));
    }
  }

  function applyWkyToEntries(start, end, detail){
    eachDateInRange(start, end, function(key){
      var entry = getEntry(key);
      entry.work = 'ＷＫＹ';
      if(entry.note){
        var lines = entry.note.split('\n');
        if(lines.indexOf(detail) === -1){
          entry.note = entry.note + '\n' + detail;
        }
      }else{
        entry.note = detail;
      }
    });
  }

  function removeWkyFromEntries(start, end, detail){
    eachDateInRange(start, end, function(key){
      var entry = getEntry(key);
      if(entry.note){
        var lines = entry.note.split('\n').filter(function(l){ return l !== detail; });
        entry.note = lines.join('\n');
      }
      var stillCovered = state.wkyList.some(function(w){
        return key >= w.start && key <= w.end;
      });
      if(!stillCovered){
        entry.work = '';
      }
    });
  }

  function addWkySchedule(start, end, detail){
    if(!start || !detail) return;
    if(!end) end = start;
    if(end < start){ var t = start; start = end; end = t; }
    var id = 'wky_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    state.wkyList.push({id:id, start:start, end:end, detail:detail});
    applyWkyToEntries(start, end, detail);
    scheduleSave('WKYスケジュールを追加：'+detail);
    renderWeekView();
  }

  function deleteWkySchedule(id){
    var idx = -1;
    for(var i=0;i<state.wkyList.length;i++){ if(state.wkyList[i].id === id){ idx = i; break; } }
    if(idx === -1) return;
    var item = state.wkyList[idx];
    state.wkyList.splice(idx,1);
    removeWkyFromEntries(item.start, item.end, item.detail);
    scheduleSave('WKYスケジュールを削除：'+item.detail);
    renderWeekView();
  }

  function formatPeriod(start, end){
    var s = start.split('-'), e = end.split('-');
    var sDate = new Date(parseInt(s[0],10), parseInt(s[1],10)-1, parseInt(s[2],10));
    var eDate = new Date(parseInt(e[0],10), parseInt(e[1],10)-1, parseInt(e[2],10));
    var sTxt = parseInt(s[1],10) + '/' + parseInt(s[2],10) + '(' + WEEKDAY_JP[sDate.getDay()] + ')';
    if(start === end) return sTxt;
    var eTxt = (s[0] === e[0] ? '' : e[0] + '/') + parseInt(e[1],10) + '/' + parseInt(e[2],10) + '(' + WEEKDAY_JP[eDate.getDay()] + ')';
    return sTxt + '〜' + eTxt;
  }

  function renderWkyList(){
    var container = document.getElementById('wkyList');
    if(!container) return;
    container.innerHTML = '';
    var sorted = state.wkyList.slice().sort(function(a,b){
      if(a.start === b.start) return a.end < b.end ? -1 : (a.end > b.end ? 1 : 0);
      return a.start < b.start ? -1 : 1;
    });
    if(sorted.length === 0){
      var empty = document.createElement('div');
      empty.className = 'wky-empty';
      empty.textContent = 'まだ登録されたＷＫＹスケジュールはありません。';
      container.appendChild(empty);
      return;
    }
    sorted.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'wky-item';

      var periodDiv = document.createElement('div');
      periodDiv.className = 'wky-item-period';
      periodDiv.textContent = formatPeriod(item.start, item.end);

      var detailDiv = document.createElement('div');
      detailDiv.className = 'wky-item-detail';
      detailDiv.textContent = item.detail;

      var delBtn = document.createElement('button');
      delBtn.className = 'wky-del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', function(){ deleteWkySchedule(item.id); });

      row.appendChild(periodDiv);
      row.appendChild(detailDiv);
      row.appendChild(delBtn);
      container.appendChild(row);
    });
  }

  // ---------------- Week view ----------------
  function renderWeekView(){
    var year = currentDate.getFullYear();
    var month = currentDate.getMonth();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var today = new Date();

    var headerRow = document.getElementById('weekHeaderRow');
    var body = document.getElementById('weekBody');
    headerRow.innerHTML = '';
    body.innerHTML = '';

    var thCorner = document.createElement('th');
    thCorner.className = 'sticky-col';
    headerRow.appendChild(thCorner);

    var rows = [];
    var workRow = document.createElement('tr');
    workRow.className = 'wk-row-work';
    var workTh = document.createElement('td');
    workTh.className = 'sticky-col row-th';
    workTh.title = 'ＷＫＹ';
    workTh.textContent = '\u{1F43B}';
    workRow.appendChild(workTh);

    var personRows = [];
    for(var pi=0; pi<4; pi++){
      var tr = document.createElement('tr');
      tr.className = 'wk-row-p' + (pi+1);
      var th = document.createElement('td');
      th.className = 'sticky-col row-th';
      th.textContent = state.persons[pi] || ('担当'+(pi+1));
      tr.appendChild(th);
      personRows.push(tr);
    }

    var noteRow = document.createElement('tr');
    noteRow.className = 'wk-row-note';
    var noteTh = document.createElement('td');
    noteTh.className = 'sticky-col row-th';
    noteTh.textContent = 'メモ';
    noteRow.appendChild(noteTh);

    for(var d=1; d<=daysInMonth; d++){
      var dateObj = new Date(year, month, d);
      var key = dateKey(dateObj);
      var entry = getEntry(key);
      var wd = dateObj.getDay();
      var isWeekStart = (wd === 0);
      var holidayName = getHolidayName(dateObj);

      // header cell
      var th2 = document.createElement('th');
      th2.className = 'day-col-cell col-header' + (isWeekStart ? ' weekstart' : '');
      if(holidayName) th2.title = holidayName;
      var wdDiv = document.createElement('div');
      wdDiv.className = 'col-weekday' + ((wd===0||holidayName)?' sun':(wd===6?' sat':''));
      wdDiv.textContent = WEEKDAY_JP[wd];
      var dateDiv = document.createElement('div');
      dateDiv.className = 'col-date' + ((wd===0||holidayName)?' sun-date':'') + (sameDay(dateObj,today)?' today':'');
      dateDiv.textContent = (month+1)+'/'+d;
      th2.appendChild(wdDiv);
      th2.appendChild(dateDiv);
      if(holidayName){
        var holDiv = document.createElement('div');
        holDiv.className = 'col-holiday';
        holDiv.textContent = holidayName;
        th2.appendChild(holDiv);
      }
      headerRow.appendChild(th2);

      // work cell
      var wTd = document.createElement('td');
      wTd.className = 'day-col-cell' + (isWeekStart ? ' weekstart' : '');
      var wSel = document.createElement('select');
      wSel.className = 'wk-select';
      wSel.setAttribute('data-date', key);
      wSel.setAttribute('data-field', 'work');
      makeSelectOptions(wSel, ['ＷＫＹ'], entry.work);
      applySelectColor(wSel, entry.work);
      wSel.addEventListener('change', function(){
        var k = this.getAttribute('data-date');
        getEntry(k).work = this.value;
        applySelectColor(this, this.value);
        scheduleSave(formatDateLabel(k)+' のＷＫＹ予定を変更');
      });
      wTd.appendChild(wSel);
      workRow.appendChild(wTd);

      // person cells
      for(var pj=0; pj<4; pj++){
        (function(pj){
          var pTd = document.createElement('td');
          pTd.className = 'day-col-cell' + (isWeekStart ? ' weekstart' : '');
          var pSel = document.createElement('select');
          pSel.className = 'wk-select';
          pSel.setAttribute('data-date', key);
          pSel.setAttribute('data-field', 'p');
          pSel.setAttribute('data-idx', pj);
          makeSelectOptions(pSel, PERSON_OPTIONS, entry.p[pj]);
          applySelectColor(pSel, entry.p[pj]);
          pSel.addEventListener('change', function(){
            var k = this.getAttribute('data-date');
            var idx = parseInt(this.getAttribute('data-idx'),10);
            getEntry(k).p[idx] = this.value;
            applySelectColor(this, this.value);
            var pname3 = state.persons[idx] || ('担当者'+(idx+1));
            scheduleSave(formatDateLabel(k)+' の'+pname3+'の予定を変更');
          });
          pTd.appendChild(pSel);
          personRows[pj].appendChild(pTd);
        })(pj);
      }

      // note cell
      var nTd = document.createElement('td');
      nTd.className = 'day-col-cell' + (isWeekStart ? ' weekstart' : '');
      var ta = document.createElement('textarea');
      ta.className = 'wk-note';
      ta.setAttribute('data-date', key);
      ta.value = entry.note || '';
      ta.addEventListener('input', function(){
        var k = this.getAttribute('data-date');
        getEntry(k).note = this.value;
        scheduleSave(formatDateLabel(k)+' のメモを編集');
      });
      nTd.appendChild(ta);
      noteRow.appendChild(nTd);
    }

    personRows.forEach(function(r){ body.appendChild(r); });
    body.appendChild(workRow);
    body.appendChild(noteRow);

    renderWkyList();
  }

  function scrollWeekToToday(){
    var today = new Date();
    if(today.getFullYear() !== currentDate.getFullYear() || today.getMonth() !== currentDate.getMonth()) return;
    requestAnimationFrame(function(){
      var el = document.querySelector('.col-date.today');
      if(el){
        var col = el.closest('.day-col-cell');
        if(col){
          var scrollBox = document.getElementById('weekScroll');
          var labelW = 52;
          scrollBox.scrollLeft = col.offsetLeft - labelW - 2;
        }
      }
    });
  }

  // ---------------- Settings ----------------
  function fillSettingsInputs(){
    for(var i=0;i<4;i++){
      document.getElementById('p'+i).value = state.persons[i] || '';
    }
    renderIdLegend();
  }

  function renderIdLegend(){
    var container = document.getElementById('idLegend');
    if(!container) return;
    container.innerHTML = '';
    var colorPairs = [
      {bg:'none', ink:'var(--ink)', border:'1px solid var(--line)'},
      {bg:'var(--pastel-green)', ink:'var(--pastel-green-ink)', border:'none'},
      {bg:'var(--pastel-red)', ink:'var(--pastel-red-ink)', border:'none'},
      {bg:'var(--pastel-orange)', ink:'var(--pastel-orange-ink)', border:'none'},
      {bg:'#E7E9EA', ink:'var(--sub-ink)', border:'none'}
    ];
    var labels = ['ＷＫＹ（仕事）'].concat(state.persons.map(function(n,i){ return n || ('担当者'+(i+1)); }));
    var chips = ['Ｗ'].concat(state.persons.map(function(n,i){ return n ? n.charAt(0) : String(i+1); }));
    for(var i=0;i<5;i++){
      var span = document.createElement('span');
      var sw = document.createElement('span');
      sw.className = 'id-swatch';
      sw.style.background = colorPairs[i].bg;
      sw.style.color = colorPairs[i].ink;
      sw.style.border = colorPairs[i].border;
      sw.textContent = chips[i];
      span.appendChild(sw);
      span.appendChild(document.createTextNode(labels[i]));
      container.appendChild(span);
    }
  }

  function bindSettingsInputs(){
    for(var i=0;i<4;i++){
      (function(i){
        document.getElementById('p'+i).addEventListener('input', function(){
          state.persons[i] = this.value;
          scheduleSave('担当者'+(i+1)+'の名前を変更');
          renderIdLegend();
          if(viewMode === 'week') renderWeekView();
          else renderMonthView();
        });
      })(i);
    }
  }

  // ---------------- Render dispatch ----------------
  function renderAll(){
    updateHeader();
    fillSettingsInputs();
    if(viewMode === 'month'){
      renderMonthView();
    }else{
      renderWeekView();
    }
  }

  // ---------------- Events ----------------
  document.getElementById('btnMonth').addEventListener('click', function(){
    viewMode = 'month'; updateHeader(); renderMonthView();
  });
  document.getElementById('btnWeek').addEventListener('click', function(){
    viewMode = 'week'; updateHeader(); renderWeekView(); scrollWeekToToday();
  });
  document.getElementById('prevBtn').addEventListener('click', function(){
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1);
    renderAll();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1);
    renderAll();
  });
  document.getElementById('todayBtn').addEventListener('click', function(){
    var t = new Date();
    currentDate = new Date(t.getFullYear(), t.getMonth(), 1);
    renderAll();
    if(viewMode==='week') scrollWeekToToday();
  });

  // ---------------- Month view swipe navigation ----------------
  (function(){
    var grid = document.getElementById('monthGrid');
    var startX = 0, startY = 0, tracking = false;
    var SWIPE_THRESHOLD = 50;
    grid.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, {passive:true});
    grid.addEventListener('touchend', function(e){
      if(!tracking) return;
      tracking = false;
      var endX = e.changedTouches[0].clientX;
      var endY = e.changedTouches[0].clientY;
      var dx = endX - startX;
      var dy = endY - startY;
      if(Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
      if(dx < 0){
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1);
      }else{
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1);
      }
      renderAll();
    }, {passive:true});
  })();
  document.getElementById('btnSettings').addEventListener('click', function(){
    document.getElementById('settingsPanel').classList.toggle('open');
  });
  document.getElementById('logoutBtn').addEventListener('click', function(){
    if(firebaseReady && typeof firebase !== 'undefined' && firebase.auth){
      firebase.auth().signOut();
    }
  });
  document.getElementById('unreadConfirmBtn').addEventListener('click', function(){
    confirmUnreadItems();
  });
  document.getElementById('wkyFormToggle').addEventListener('click', function(){
    var body = document.getElementById('wkyFormBody');
    var btn = document.getElementById('wkyFormToggle');
    var willOpen = body.classList.contains('collapsed');
    body.classList.toggle('collapsed', !willOpen);
    btn.classList.toggle('open', willOpen);
    btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });
  document.getElementById('wkyAddBtn').addEventListener('click', function(){
    var startEl = document.getElementById('wkyStart');
    var endEl = document.getElementById('wkyEnd');
    var detailEl = document.getElementById('wkyDetail');
    var start = startEl.value;
    var end = endEl.value;
    var detail = detailEl.value.trim();
    if(!start || !detail){
      alert('開始日と詳細を入力してください。');
      return;
    }
    addWkySchedule(start, end, detail);
    detailEl.value = '';
  });

  function updateWkyWeekdayLabel(inputId, spanId){
    var val = document.getElementById(inputId).value;
    var span = document.getElementById(spanId);
    if(!val){ span.textContent = ''; return; }
    var parts = val.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    span.textContent = '(' + WEEKDAY_JP[d.getDay()] + ')';
  }
  document.getElementById('wkyStart').addEventListener('input', function(){
    updateWkyWeekdayLabel('wkyStart','wkyStartWeekday');
  });
  document.getElementById('wkyEnd').addEventListener('input', function(){
    updateWkyWeekdayLabel('wkyEnd','wkyEndWeekday');
  });

  (function initWkyDateDefaults(){
    var todayStr = dateKey(new Date());
    document.getElementById('wkyStart').value = todayStr;
    document.getElementById('wkyEnd').value = todayStr;
    updateWkyWeekdayLabel('wkyStart','wkyStartWeekday');
    updateWkyWeekdayLabel('wkyEnd','wkyEndWeekday');
  })();

  // ---------------- Init ----------------
  bindSettingsInputs();
  renderAll();

  function bootApp(){
    if(viewMode==='week') scrollWeekToToday();
    loadState().then(function(){
      renderAll();
      if(viewMode==='week') scrollWeekToToday();
      attachRealtimeListener();
      attachChangeLogListener();
    });
  }

  function showLogin(){
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('app').style.display = 'none';
  }

  function hideLogin(){
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('app').style.display = '';
  }

  function setupLoginForm(){
    var btn = document.getElementById('loginBtn');
    var emailEl = document.getElementById('loginEmail');
    var passEl = document.getElementById('loginPassword');
    var errEl = document.getElementById('loginError');
    function doLogin(){
      errEl.textContent = '';
      btn.disabled = true;
      firebase.auth().signInWithEmailAndPassword(emailEl.value.trim(), passEl.value)
        .catch(function(){
          errEl.textContent = 'ログインに失敗しました。メールアドレスとパスワードをご確認ください。';
        })
        .then(function(){ btn.disabled = false; });
    }
    btn.addEventListener('click', doLogin);
    passEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
    emailEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  }

  initFirebase();
  if(firebaseReady){
    setupLoginForm();
    firebase.auth().onAuthStateChanged(function(user){
      if(user){
        hideLogin();
        bootApp();
      }else{
        if(changeLogRef){ changeLogRef.off(); changeLogRef = null; }
        unreadItems = [];
        renderUnreadPanel();
        showLogin();
      }
    });
  }else{
    // Firebase未設定の間はログイン不要でローカル保存のみで動作
    hideLogin();
    bootApp();
  }

})();
</script>
</body>
</html>
