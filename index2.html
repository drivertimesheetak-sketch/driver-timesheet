<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12151a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日報サポート">
  <link rel="manifest"
    href="data:application/manifest+json,%7B%22name%22%3A%22%E6%97%A5%E5%A0%B1%E3%82%B5%E3%83%9D%E3%83%BC%E3%83%88%22%2C%22short_name%22%3A%22%E6%97%A5%E5%A0%B1%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2312151a%22%2C%22theme_color%22%3A%22%2312151a%22%7D">
  <title>日報サポート - 走行記録</title>
  <style>
    :root {
      --bg: #12151a;
      --bg-elev: #1b1f27;
      --bg-elev2: #232833;
      --border: #2b313d;
      --text: #eef1f5;
      --text-dim: #8d97a5;
      --amber: #f2a93b;
      --amber-dim: #7a5a26;
      --teal: #49d3c8;
      --teal-dim: #1f5c56;
      --danger: #e2574c;
      --danger-dim: #7a2e29;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #1c212b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 24px);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    .mono {
      font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 4px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
      margin: 0;
      color: var(--text);
    }

    header .date {
      font-size: 13px;
      color: var(--text-dim);
    }

    .gauge-card {
      background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-elev2) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 18px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .gauge-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: conic-gradient(from 180deg, transparent 0 70%, var(--gauge-color, var(--text-dim)) 70% 100%);
      opacity: .06;
      pointer-events: none;
    }

    .status-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: .06em;
      margin-bottom: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex: none;
    }

    .status-dot.moving {
      background: var(--teal);
      box-shadow: 0 0 10px var(--teal);
    }

    .status-dot.waiting {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    .status-dot.ended {
      background: var(--danger);
    }

    .big-timer {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--text);
      line-height: 1.05;
    }

    .big-timer.moving {
      color: var(--teal);
    }

    .big-timer.waiting {
      color: var(--amber);
    }

    .sub-line {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .sub-line a {
      color: var(--teal);
      text-decoration: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      border: none;
      border-radius: 14px;
      padding: 18px 10px;
      cursor: pointer;
      color: var(--text);
      transition: transform .08s ease, opacity .15s ease;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .32;
      cursor: not-allowed;
    }

    .btn-start {
      background: var(--teal);
      color: #08201d;
      grid-column: 1/3;
    }

    .btn-depart {
      background: var(--bg-elev2);
      border: 1px solid var(--amber-dim);
      color: var(--amber);
    }

    .btn-end {
      background: var(--bg-elev2);
      border: 1px solid var(--danger-dim);
      color: var(--danger);
    }

    .btn-result {
      background: var(--bg-elev2);
      border: 1px solid var(--border);
      color: var(--text);
      grid-column: 1/3;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12.5px;
      padding: 9px 12px;
      font-weight: 600;
      border-radius: 10px;
    }

    .btn-route {
      background: var(--bg-elev);
      border: 1px solid var(--teal-dim);
      color: var(--teal);
      font-size: 12.5px;
      padding: 8px 12px;
      font-weight: 600;
      border-radius: 10px;
    }

    .notice {
      font-size: 12.5px;
      color: var(--text-dim);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .notice.err {
      color: var(--danger);
      border-color: var(--danger-dim);
    }

    #resultsSection {
      display: none;
    }

    .summary-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-box {
      flex: 1;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .summary-box .label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      letter-spacing: .04em;
    }

    .summary-box .value {
      font-size: 20px;
      font-weight: 700;
    }

    .summary-box.teal .value {
      color: var(--teal);
    }

    .summary-box.amber .value {
      color: var(--amber);
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leg-card,
    .wait-card {
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--border);
    }

    .leg-card {
      background: linear-gradient(180deg, rgba(73, 211, 200, .07), rgba(73, 211, 200, 0) 60%);
      border-color: var(--teal-dim);
    }

    .wait-card {
      background: linear-gradient(180deg, rgba(242, 169, 59, .06), rgba(242, 169, 59, 0) 60%);
      border-color: var(--amber-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .leg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .leg-tag {
      font-size: 11px;
      color: var(--teal);
      letter-spacing: .06em;
      font-weight: 700;
    }

    .leg-dur {
      font-size: 12px;
      color: var(--text-dim);
    }

    .leg-points {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
    }

    .point-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .point-row .t {
      color: var(--text-dim);
      width: 52px;
      flex: none;
    }

    .point-row a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dotted var(--text-dim);
    }

    .leg-foot {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .wait-tag {
      font-size: 11px;
      color: var(--amber);
      letter-spacing: .06em;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .wait-time {
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .wait-dur {
      font-size: 15px;
      font-weight: 700;
      color: var(--amber);
    }

    .inprogress {
      font-size: 11px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      margin-left: 6px;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      margin: 16px 0;
      flex-wrap: wrap;
    }

    .empty-msg {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      padding: 24px 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 6px 10px;
      gap: 14px;
    }

    .title-logo {
      font-size: 52px;
    }

    .title-copy {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: .1em;
      margin-bottom: 6px;
    }

    .btn-mode {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-elev2) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 20px;
      text-align: left;
    }

    .btn-mode-ride {
      border-color: var(--teal-dim);
    }

    .btn-mode-ride .mode-icon,
    .btn-mode-ride .mode-label {
      color: var(--teal);
    }

    .btn-mode-record {
      border-color: var(--amber-dim);
    }

    .btn-mode-record .mode-icon,
    .btn-mode-record .mode-label {
      color: var(--amber);
    }

    .mode-icon {
      font-size: 26px;
    }

    .mode-label {
      font-size: 17px;
      font-weight: 700;
    }

    .mode-desc {
      font-size: 12.5px;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0;
    }

    .btn-back {
      display: inline-block;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 0 16px;
      margin: 0;
      cursor: pointer;
    }

    .screen-heading {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 14px;
      color: var(--text);
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform .08s ease;
    }

    .record-item:active {
      transform: scale(.98);
    }

    .record-item .rd-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .record-item .rd-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .record-item .rd-arrow {
      color: var(--text-dim);
      font-size: 20px;
    }

    .rd-toprow {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .record-item .rd-time {
      font-size: 12.5px;
      color: var(--teal);
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 11, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-box {
      background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-elev2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .modal-msg {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .modal-btn-cancel {
      background: var(--bg-elev2);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .modal-btn-danger {
      background: var(--danger);
      color: #2a0f0c;
    }

    .modal-btn-ok {
      background: var(--teal);
      color: #08201d;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚗 日報サポート</h1>
    <div class="date mono" id="todayLabel">--</div>
  </header>

  <div class="screen active" id="screenTitle">
    <div class="title-wrap">
      <div class="title-logo">🚗</div>
      <div class="title-copy">日報サポートを開始します</div>
      <button class="btn-mode btn-mode-ride" id="btnModeRide">
        <span class="mode-icon">🚙</span>
        <span class="mode-label">乗車モード</span>
        <span class="mode-desc">乗務を開始して走行・待機を記録します</span>
      </button>
      <button class="btn-mode btn-mode-record" id="btnModeRecord">
        <span class="mode-icon">📖</span>
        <span class="mode-label">記録モード</span>
        <span class="mode-desc">過去の記録を一覧で確認します</span>
      </button>
    </div>
  </div>

  <div class="screen" id="screenRide">
    <button class="btn-back" id="btnBackFromRide">← タイトルに戻る</button>

    <div class="gauge-card" id="gaugeCard">
      <div class="status-label"><span class="status-dot" id="statusDot"></span><span id="statusText">乗務前</span></div>
      <div class="big-timer mono" id="bigTimer">00:00:00</div>
      <div class="sub-line" id="subLine">「乗務開始」をタップして記録を始めてください</div>
    </div>

    <div class="notice" id="gpsNotice">位置情報の使用を許可すると自動記録が始まります。</div>

    <div class="controls">
      <button class="btn-start" id="btnStart">乗務開始</button>
      <button class="btn-depart" id="btnDepart" disabled>出発（強制区切り）</button>
      <button class="btn-end" id="btnEnd" disabled>業務終了</button>
      <button class="btn-result" id="btnResult">結果を表示</button>
    </div>

    <section id="resultsSection">
      <div class="summary-row">
        <div class="summary-box teal">
          <div class="label">走行区間</div>
          <div class="value" id="sumLegs">0</div>
        </div>
        <div class="summary-box amber">
          <div class="label">待機時間 合計</div>
          <div class="value" id="sumWait">0分</div>
        </div>
        <div class="summary-box">
          <div class="label">業務時間</div>
          <div class="value" id="sumWork">-</div>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn-route" id="btnAllRoute">🗺 全経路を表示</button>
        <button class="btn-ghost" id="btnCsv">CSV出力</button>
        <button class="btn-ghost" id="btnImportGpsLog">📥 外部GPSログ取込</button>
        <button class="btn-ghost" id="btnNewShift" style="display:none;">🔄 新しい記録を開始</button>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>
  </div>

  <div class="screen" id="screenRecordList">
    <button class="btn-back" id="btnBackFromList">← タイトルに戻る</button>
    <h2 class="screen-heading">記録一覧</h2>
    <div id="recordListContainer"></div>
  </div>

  <div class="screen" id="screenRecordDetail">
    <button class="btn-back" id="btnBackFromDetail">← 記録一覧に戻る</button>
    <h2 class="screen-heading mono" id="recordDetailDate">--</h2>
    <div class="summary-row" id="recordDetailSummary"></div>
    <div class="result-actions">
      <button class="btn-route" id="btnRecordAllRoute">🗺 全経路を表示</button>
      <button class="btn-ghost" id="btnRecordCsv">CSV出力</button>
      <button class="btn-ghost" id="btnRecordImportGpsLog">📥 外部GPSログ取込</button>
      <button class="btn-ghost" id="btnRecordDelete">🗑 この記録を削除</button>
    </div>
    <div class="timeline" id="recordDetailTimeline"></div>
  </div>

  <input type="file" id="gpsLogFileInput"
    accept=".csv,.gpx,.json,.geojson,text/csv,application/json,application/gpx+xml" style="display:none">

  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // ---------- 定数 ----------
      const STILL_METERS = 30;          // これ未満の移動は「停止」とみなす誤差
      const STILL_MS = 5 * 60 * 1000;       // 5分停止で到着とみなす
      const TICK_MS = 1000;
      const GAP_WARN_MS = 3 * 60 * 1000;    // 復帰時、これ以上の空白があれば注意喚起を表示

      // ---------- 状態 ----------
      let state = "idle"; // idle | moving | waiting | ended
      let watchId = null;
      // 乗務開始／出発／業務終了はGPS取得が完了するまで数秒かかる非同期処理のため、
      // 返答待ちの間にボタンを連打されると同じ操作が二重に実行され（例：記録が2件重複保存される）
      // てしまう。このフラグでGPS応答待ちの間は同じ操作を受け付けないようにする。
      let gpsActionBusy = false;

      let workStart = null, workEnd = null;
      let legs = [];   // {depPoint, depTime, arrPoint, arrTime, path:[{lat,lng,t}]}
      let waits = [];  // {point, startTime, endTime}

      let curLegDep = null, curLegDepTime = null, curLegPath = [];
      let anchorPoint = null, anchorTime = null;
      let waitPoint = null, waitStart = null;

      // ---------- DOM ----------
      const $ = id => document.getElementById(id);
      const statusDot = $("statusDot"), statusText = $("statusText"), bigTimer = $("bigTimer"), subLine = $("subLine");
      const btnStart = $("btnStart"), btnDepart = $("btnDepart"), btnEnd = $("btnEnd"), btnResult = $("btnResult");
      const gpsNotice = $("gpsNotice");
      const resultsSection = $("resultsSection");

      $("todayLabel").textContent = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });

      // ---------- カスタムダイアログ（ホーム画面追加のアプリ表示では window.confirm/alert が反応しないことがあるため自前実装） ----------
      const modalOverlay = $("modalOverlay"), modalMsg = $("modalMsg"), modalActions = $("modalActions");
      function closeModal() { modalOverlay.style.display = "none"; modalActions.innerHTML = ""; }
      function showConfirm(message, okLabel, danger) {
        return new Promise(resolve => {
          modalMsg.textContent = message;
          modalActions.innerHTML = "";
          const btnCancel = document.createElement("button");
          btnCancel.className = "modal-btn-cancel";
          btnCancel.textContent = "キャンセル";
          btnCancel.addEventListener("click", () => { closeModal(); resolve(false); });
          const btnOk = document.createElement("button");
          btnOk.className = danger ? "modal-btn-danger" : "modal-btn-ok";
          btnOk.textContent = okLabel || "OK";
          btnOk.addEventListener("click", () => { closeModal(); resolve(true); });
          modalActions.appendChild(btnCancel);
          modalActions.appendChild(btnOk);
          modalOverlay.style.display = "flex";
        });
      }
      function showAlert(message) {
        return new Promise(resolve => {
          modalMsg.textContent = message;
          modalActions.innerHTML = "";
          const btnOk = document.createElement("button");
          btnOk.className = "modal-btn-ok";
          btnOk.textContent = "OK";
          btnOk.addEventListener("click", () => { closeModal(); resolve(); });
          modalActions.appendChild(btnOk);
          modalOverlay.style.display = "flex";
        });
      }
      modalOverlay.addEventListener("click", e => {
        if (e.target === modalOverlay) { /* 誤タップでの閉じは無効（削除など誤操作防止） */ }
      });

      // ---------- 画面切り替え ----------
      const RECORDS_KEY = "nippo_records_v1";
      const screens = {
        title: $("screenTitle"),
        ride: $("screenRide"),
        recordList: $("screenRecordList"),
        recordDetail: $("screenRecordDetail")
      };
      function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove("active"));
        screens[name].classList.add("active");
      }
      let currentRecordId = null;

      $("btnModeRide").addEventListener("click", () => showScreen("ride"));
      $("btnModeRecord").addEventListener("click", () => { renderRecordList(); showScreen("recordList"); });
      $("btnBackFromRide").addEventListener("click", () => showScreen("title"));
      $("btnBackFromList").addEventListener("click", () => showScreen("title"));
      $("btnBackFromDetail").addEventListener("click", () => { renderRecordList(); showScreen("recordList"); });

      // ---------- 過去の記録の保存・読込 ----------
      function loadRecords() {
        try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; }
        catch (e) { return []; }
      }
      function saveRecordsToStorage(recs) {
        localStorage.setItem(RECORDS_KEY, JSON.stringify(recs));
      }
      function saveCurrentRecord() {
        const recs = loadRecords();
        recs.push({ id: Date.now(), workStart, workEnd, legs, waits });
        saveRecordsToStorage(recs);
      }

      // ---------- 進行中の記録の永続化（バックグラウンド終了・強制終了対策） ----------
      // スマホのOS／ブラウザは、画面ロックや長時間のバックグラウンド化でタブやアプリの
      // プロセスごと終了させることがある（メモリ上の変数はJSタイマーやGPSコールバックごと消える）。
      // これはWebアプリの仕組み上、完全には防止できない（ネイティブアプリのような
      // バックグラウンド常駐は不可能）。そのため「止めない」のではなく「止まっても失わない・
      // 正しく復元する」方針で対策する：進行中の状態をこまめにlocalStorageへ保存しておき、
      // 次にアプリが開かれた瞬間（=生きているタイミング）に、保存時刻や壁時計をもとに
      // 状態を復元し、5分停止ルールも遡って正しく判定する。
      const INPROGRESS_KEY = "nippo_inprogress_v1";
      function saveInProgress() {
        try {
          if (state === "moving" || state === "waiting") {
            localStorage.setItem(INPROGRESS_KEY, JSON.stringify({
              state, workStart, legs, waits,
              curLegDep, curLegDepTime, curLegPath,
              anchorPoint, anchorTime,
              waitPoint, waitStart,
              savedAt: Date.now()
            }));
          } else {
            localStorage.removeItem(INPROGRESS_KEY);
          }
        } catch (e) { /* 保存失敗（容量超過等）は無視。次回機会に再試行される */ }
      }
      function clearInProgress() {
        try { localStorage.removeItem(INPROGRESS_KEY); } catch (e) { /* ignore */ }
      }
      function loadInProgress() {
        try { return JSON.parse(localStorage.getItem(INPROGRESS_KEY)); }
        catch (e) { return null; }
      }
      function restoreInProgress() {
        const data = loadInProgress();
        if (!data || (data.state !== "moving" && data.state !== "waiting")) return false;
        state = data.state;
        workStart = data.workStart;
        legs = data.legs || [];
        waits = data.waits || [];
        curLegDep = data.curLegDep; curLegDepTime = data.curLegDepTime; curLegPath = data.curLegPath || [];
        anchorPoint = data.anchorPoint; anchorTime = data.anchorTime;
        waitPoint = data.waitPoint; waitStart = data.waitStart;
        return true;
      }

      function renderRecordList() {
        const recs = loadRecords().slice().sort((a, b) => b.id - a.id);
        const container = $("recordListContainer");
        container.innerHTML = "";
        if (recs.length === 0) {
          container.innerHTML = '<div class="empty-msg">まだ記録がありません。</div>';
          return;
        }
        recs.forEach(rec => {
          const div = document.createElement("div");
          div.className = "record-item";
          const dateLabel = new Date(rec.workStart).toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });
          const workDur = fmtDuration((rec.workEnd || Date.now()) - rec.workStart);
          const timeRange = `${fmtClockKanji(rec.workStart)}〜${fmtClockKanji(rec.workEnd || Date.now())}`;
          div.innerHTML = `
        <div>
          <div class="rd-toprow">
            <span class="rd-date mono">${dateLabel}</span>
            <span class="rd-time mono">${timeRange}</span>
          </div>
          <div class="rd-sub">業務時間 ${workDur}｜走行区間 ${rec.legs.length}件</div>
        </div>
        <div class="rd-arrow">›</div>
      `;
          div.addEventListener("click", () => {
            currentRecordId = rec.id;
            renderRecordDetail(rec);
            showScreen("recordDetail");
          });
          container.appendChild(div);
        });
      }

      function renderRecordDetail(rec) {
        $("recordDetailDate").textContent = new Date(rec.workStart).toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });
        const totalWait = rec.waits.reduce((s, w) => s + (w.endTime - w.startTime), 0);
        $("recordDetailSummary").innerHTML = `
      <div class="summary-box teal"><div class="label">走行区間</div><div class="value">${rec.legs.length}</div></div>
      <div class="summary-box amber"><div class="label">待機時間 合計</div><div class="value">${fmtDuration(totalWait)}</div></div>
      <div class="summary-box"><div class="label">業務時間</div><div class="value">${fmtDuration((rec.workEnd || Date.now()) - rec.workStart)}</div></div>
    `;
        const timeline = $("recordDetailTimeline");
        timeline.innerHTML = "";
        if (rec.legs.length === 0 && rec.waits.length === 0) {
          timeline.innerHTML = '<div class="empty-msg">記録がありません。</div>';
        } else {
          renderTimelineInto(timeline, rec.legs, rec.waits);
        }
      }

      $("btnRecordAllRoute").addEventListener("click", () => {
        const rec = loadRecords().find(r => r.id === currentRecordId);
        if (!rec) return;
        let full = [];
        rec.legs.forEach(l => { full = full.concat(l.path); });
        const link = routeLink(full);
        if (link) window.open(link, "_blank");
        else showAlert("表示できる経路がありません。");
      });

      $("btnRecordCsv").addEventListener("click", () => {
        const rec = loadRecords().find(r => r.id === currentRecordId);
        if (!rec) return;
        exportCsvGeneric(rec.legs, rec.waits, new Date(rec.workStart));
      });

      $("btnRecordDelete").addEventListener("click", async () => {
        const ok = await showConfirm("この記録を削除しますか？\nこの操作は取り消せません。", "削除する", true);
        if (!ok) return;
        const recs = loadRecords().filter(r => r.id !== currentRecordId);
        saveRecordsToStorage(recs);
        renderRecordList();
        showScreen("recordList");
      });

      function resetForNewShift() {
        releaseWakeLock();
        clearInProgress();
        gpsActionBusy = false;
        state = "idle";
        workStart = null; workEnd = null;
        legs = []; waits = [];
        curLegDep = null; curLegDepTime = null; curLegPath = [];
        anchorPoint = null; anchorTime = null;
        waitPoint = null; waitStart = null;
        gpsNotice.classList.remove("err");
        gpsNotice.textContent = "位置情報の使用を許可すると自動記録が始まります。";
        resultsSection.style.display = "none";
        $("btnNewShift").style.display = "none";
        refreshButtons();
        tick();
      }
      $("btnNewShift").addEventListener("click", resetForNewShift);

      // ---------- ユーティリティ ----------
      function distanceMeters(a, b) {
        const R = 6371000;
        const dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
        const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }
      function fmtClock(ms) {
        const d = new Date(ms);
        return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      }
      function fmtClockKanji(ms) {
        const d = new Date(ms);
        return `${d.getHours()}時${String(d.getMinutes()).padStart(2, "0")}分`;
      }
      function fmtHMS(ms) {
        ms = Math.max(0, ms);
        const s = Math.floor(ms / 1000);
        const hh = String(Math.floor(s / 3600)).padStart(2, "0");
        const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
      }
      function fmtDuration(ms) {
        ms = Math.max(0, ms);
        const totalMin = Math.round(ms / 60000);
        const h = Math.floor(totalMin / 60), m = totalMin % 60;
        if (h <= 0) return `${m}分`;
        if (m === 0) return `${h}時間`;
        return `${h}時間${m}分`;
      }
      function pointLink(p) {
        return `https://www.google.com/maps/search/?api=1&query=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
      }
      function sample(arr, max) {
        if (arr.length <= max) return arr.slice();
        const out = [];
        const step = (arr.length - 1) / (max - 1);
        for (let i = 0; i < max; i++) out.push(arr[Math.round(i * step)]);
        return out;
      }
      function routeLink(path) {
        if (!path || path.length < 2) return null;
        const pts = sample(path, 25);
        const origin = pts[0], destination = pts[pts.length - 1];
        const mid = pts.slice(1, -1);
        let url = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat.toFixed(6)},${origin.lng.toFixed(6)}`
          + `&destination=${destination.lat.toFixed(6)},${destination.lng.toFixed(6)}`
          + `&travelmode=driving`;
        if (mid.length) {
          url += `&waypoints=${mid.map(p => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`).join("|")}`;
        }
        return url;
      }
      function allRouteLink() {
        let full = [];
        legs.forEach(l => { full = full.concat(l.path); });
        if (state === "moving") full = full.concat(curLegPath);
        return routeLink(full);
      }

      // ---------- 表示更新 ----------
      function setStatus(kind, label) {
        statusDot.className = "status-dot" + (kind ? (" " + kind) : "");
        statusText.textContent = label;
        bigTimer.className = "big-timer mono" + (kind === "moving" ? " moving" : kind === "waiting" ? " waiting" : "");
      }

      let lastPeriodicSave = 0;
      function tick() {
        checkArrivalTimeout(); // 毎秒、GPS更新の有無に関わらず5分経過をチェック
        const now = Date.now();
        if ((state === "moving" || state === "waiting") && now - lastPeriodicSave > 15000) {
          // GPS更新が来ない間も定期的に保存しておく（強制終了・タブ破棄への保険）
          saveInProgress();
          lastPeriodicSave = now;
        }
        if (state === "moving") {
          setStatus("moving", "走行中（区間 " + (legs.length + 1) + "）");
          bigTimer.textContent = fmtHMS(now - curLegDepTime);
          subLine.innerHTML = `出発 ${fmtClock(curLegDepTime)}｜停止5分で自動的に到着記録します`;
        } else if (state === "waiting") {
          setStatus("waiting", "待機中");
          bigTimer.textContent = fmtHMS(now - waitStart);
          subLine.innerHTML = `到着 ${fmtClock(waitStart)}｜動き出すと自動的に次の区間を開始します`;
        } else if (state === "ended") {
          setStatus("ended", "業務終了");
          bigTimer.textContent = fmtHMS((workEnd || now) - (workStart || now));
          subLine.textContent = "本日の記録は終了しました。「結果を表示」で確認できます。";
        } else {
          setStatus("", "乗務前");
          bigTimer.textContent = "00:00:00";
          subLine.textContent = "「乗務開始」をタップして記録を始めてください";
        }
      }
      setInterval(tick, TICK_MS);
      tick();

      // ---------- バックグラウンド復帰時の取りこぼし対策 ----------
      // スマホのブラウザ／ホーム画面アプリは、画面ロックやアプリ切替中はJSタイマーやGPSコールバックが
      // 実質停止することがある（OS側の省電力制御）。これは純粋なWebアプリでは完全には防げないが、
      // 復帰した瞬間に必ず checkArrivalTimeout() を実行することで、実際に停止し始めた時刻(anchorTime)を
      // 使って正しく「到着」を確定できるようにする（表示上「走行中のまま」固まるのを防ぐ）。
      function onForegroundReturn() {
        checkArrivalTimeout();
        tick();
        handleResumeFix();
      }

      // ---------- スリープ・バックグラウンド復帰時の即時補正 ----------
      // スリープ中はwatchPositionのコールバックが発火しないため、「待機中に動き出した」
      // 判定は次にGPSが更新されるまで検出できない（=復帰するまで待機のまま固まる）。
      // また一部のAndroid端末では、長時間のスリープ後にwatchPositionが停止したまま
      // 再開しないことがある。そこで画面が復帰した瞬間に
      //  ①その場でgetCurrentPositionを1回呼び、通常のGPSコールバックと同じロジックで
      //    即座に反映する（＝次の定期更新を待たずに「走行再開」「到着」を確定させる）
      //  ②watchPositionを念のため一度止めて張り直す
      // という2点を行うことで、実用上ほぼ取りこぼしのないレベルまで改善する。
      // ただし画面が完全にロックされている間は、OSがブラウザのJS実行そのものを
      // 一時停止させるため、スリープ中の経路（訪問先の間の道のり）自体は記録できない。
      // このアプリが行えるのはあくまで「復帰した瞬間に正しい状態へ即座に補正する」ことまでで、
      // ネイティブアプリのような完全なバックグラウンド追跡はWebアプリの技術的制約上不可能。
      let resumeFixBusy = false;
      function handleResumeFix() {
        if (!(state === "moving" || state === "waiting") || resumeFixBusy) return;
        resumeFixBusy = true;
        const gapStart = state === "moving" ? anchorTime : waitStart;
        navigator.geolocation.getCurrentPosition(
          pos => {
            resumeFixBusy = false;
            const gapMs = gapStart ? Date.now() - gapStart : 0;
            onPosition(pos); // 通常のGPS更新と全く同じロジックで即座に判定・反映する
            if (gapMs > GAP_WARN_MS && (state === "moving" || state === "waiting")) {
              gpsNotice.classList.remove("err");
              gpsNotice.textContent = `復帰しました（前回の更新から約${Math.round(gapMs / 60000)}分経過）。スリープ中の詳細な経路は記録できていない場合があります。`;
            }
          },
          () => { resumeFixBusy = false; /* 取得失敗時は次のwatchPositionに任せる */ },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
        // 長時間のスリープ後、端末によってはwatchPositionが停止したまま復帰しないことがあるため
        // 念のため張り直す（実行中の位置取得には影響しない）
        stopWatch();
        startWatch();
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") onForegroundReturn();
        else saveInProgress(); // バックグラウンドへ移る瞬間に最新状態を保存しておく
      });
      window.addEventListener("focus", onForegroundReturn);
      window.addEventListener("pageshow", onForegroundReturn);
      // pagehide／beforeunloadはタブ破棄・強制終了の直前に呼ばれる可能性があるため、
      // 最後のチャンスとして保存を試みる（OSによっては呼ばれずに終了することもある）
      window.addEventListener("pagehide", saveInProgress);
      window.addEventListener("beforeunload", saveInProgress);

      // ---------- Wake Lock（対応端末のみ）----------
      // 画面がスリープするとブラウザのタイマー／GPSが止まりやすくなるため、
      // 乗務中はできる範囲で画面スリープを防止する（未対応環境では何もしない）。
      let wakeLock = null;
      async function requestWakeLockIfPossible() {
        try {
          if ("wakeLock" in navigator && (state === "moving" || state === "waiting")) {
            wakeLock = await navigator.wakeLock.request("screen");
            // 一部の環境ではOS側の判断でWake Lockが解除されることがある。
            // 乗務中であれば、画面が表示されているタイミングで再取得を試みる。
            wakeLock.addEventListener("release", () => {
              if (document.visibilityState === "visible" && (state === "moving" || state === "waiting")) {
                requestWakeLockIfPossible();
              }
            });
          }
        } catch (e) { /* 非対応・許可エラーは無視 */ }
      }
      function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().catch(() => { }); wakeLock = null; }
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && (state === "moving" || state === "waiting")) {
          requestWakeLockIfPossible();
        }
      });

      function refreshButtons() {
        btnStart.disabled = state !== "idle";
        btnDepart.disabled = state !== "moving";
        btnEnd.disabled = !(state === "moving" || state === "waiting");
      }

      // ---------- GPSコールバック ----------
      // 「5分停止で到着」の判定は、GPSの新しい測位が来た瞬間にしか行われないと、
      // 停車中に測位が来ない（間引かれる／バックグラウンドで止まる）場合に永遠に「走行中」のままになる。
      // そのため判定ロジックを checkArrivalTimeout() として独立させ、GPSコールバックだけでなく
      // 毎秒のtick()や、アプリがフォアグラウンドに戻った瞬間にも壁時計（Date.now()）で判定できるようにする。
      // 到着時刻・待機開始時刻には常に「実際に停止し始めた時刻」= anchorTime を使う（判定が実行された時刻ではない）。
      function checkArrivalTimeout() {
        if (state !== "moving" || !anchorPoint) return;
        if (Date.now() - anchorTime >= STILL_MS) {
          arriveAt(anchorPoint, anchorTime);
        }
      }

      function onPosition(pos) {
        const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
        if (pos.coords.accuracy && pos.coords.accuracy > 100) return; // 精度が悪い測位は無視

        if (state === "moving") {
          curLegPath.push(p);
          if (!anchorPoint) { anchorPoint = p; anchorTime = p.t; saveInProgress(); return; }
          const d = distanceMeters(anchorPoint, p);
          if (d > STILL_METERS) {
            anchorPoint = p; anchorTime = p.t; // 動いている間はアンカーを更新し続ける
          } else {
            // 測位は来たが動いていない → 念のためここでも壁時計で判定（取りこぼし防止）
            checkArrivalTimeout();
          }
          saveInProgress();
        } else if (state === "waiting") {
          const d = distanceMeters(waitPoint, p);
          if (d > STILL_METERS) {
            departFromWaiting(p);
          }
        }
      }
      function onPositionError(err) {
        gpsNotice.textContent = "位置情報を取得できません（" + (err.message || "エラー") + "）。設定をご確認ください。";
        gpsNotice.classList.add("err");
      }

      function startWatch() {
        if (!("geolocation" in navigator)) {
          gpsNotice.textContent = "この端末では位置情報が利用できません。";
          gpsNotice.classList.add("err");
          return;
        }
        watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
          enableHighAccuracy: true, maximumAge: 0, timeout: 20000
        });
        gpsNotice.textContent = "GPS記録中です。長時間画面をロックすると記録が一時停止することがありますが、次にこの画面を開いた時点で自動的に復元・補正されます。";
      }
      function stopWatch() {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      }

      // ---------- 状態遷移 ----------
      function arriveAt(point, time) {
        // 乗務開始から一度もSTILL_METERS以上動かないまま待機になった場合、
        // 実体のない「区間1」（出発地点=到着地点の移動なし区間）を記録に残さず、
        // 業務開始時刻から直接「待機」として記録する。
        const noMovementYet = legs.length === 0 &&
          curLegPath.every(p => distanceMeters(curLegDep, p) < STILL_METERS);
        if (noMovementYet) {
          state = "waiting";
          waitPoint = curLegDep;
          waitStart = curLegDepTime;
          refreshButtons();
          saveInProgress();
          return;
        }
        legs.push({ depPoint: curLegDep, depTime: curLegDepTime, arrPoint: point, arrTime: time, path: curLegPath.slice() });
        state = "waiting";
        waitPoint = point; waitStart = time;
        refreshButtons();
        saveInProgress();
      }
      function departFromWaiting(p) {
        waits.push({ point: waitPoint, startTime: waitStart, endTime: p.t });
        curLegDep = p; curLegDepTime = p.t; curLegPath = [p];
        anchorPoint = p; anchorTime = p.t;
        state = "moving";
        refreshButtons();
        saveInProgress();
      }

      btnStart.addEventListener("click", () => {
        if (state !== "idle" || gpsActionBusy) return;
        gpsActionBusy = true;
        navigator.geolocation.getCurrentPosition(pos => {
          gpsActionBusy = false;
          const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
          workStart = p.t;
          curLegDep = p; curLegDepTime = p.t; curLegPath = [p];
          anchorPoint = p; anchorTime = p.t;
          state = "moving";
          refreshButtons();
          startWatch();
          requestWakeLockIfPossible();
          saveInProgress();
        }, err => { gpsActionBusy = false; onPositionError(err); }, { enableHighAccuracy: true, timeout: 20000 });
      });

      btnDepart.addEventListener("click", () => {
        if (state !== "moving" || gpsActionBusy) return;
        gpsActionBusy = true;
        navigator.geolocation.getCurrentPosition(pos => {
          gpsActionBusy = false;
          const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
          curLegPath.push(p);
          legs.push({ depPoint: curLegDep, depTime: curLegDepTime, arrPoint: p, arrTime: p.t, path: curLegPath.slice() });
          curLegDep = p; curLegDepTime = p.t; curLegPath = [p];
          anchorPoint = p; anchorTime = p.t;
          // stateはmovingのまま（待機を挟まない強制区切り）
          saveInProgress();
        }, err => { gpsActionBusy = false; onPositionError(err); }, { enableHighAccuracy: true, timeout: 20000 });
      });

      btnEnd.addEventListener("click", () => {
        if (!(state === "moving" || state === "waiting") || gpsActionBusy) return;
        gpsActionBusy = true;
        const finish = (p) => {
          // GPS応答待ちの間に連打されても、状態は既に「ended」に変わっているため、
          // 二重に finish() が呼ばれて記録が重複保存されるのを防ぐ。
          if (state !== "moving" && state !== "waiting") { gpsActionBusy = false; return; }
          if (state === "moving") {
            if (p) curLegPath.push(p);
            const last = p || curLegPath[curLegPath.length - 1] || curLegDep;
            legs.push({ depPoint: curLegDep, depTime: curLegDepTime, arrPoint: last, arrTime: (p ? p.t : Date.now()), path: curLegPath.slice() });
          } else if (state === "waiting") {
            waits.push({ point: waitPoint, startTime: waitStart, endTime: Date.now() });
          }
          workEnd = Date.now();
          state = "ended";
          stopWatch();
          releaseWakeLock();
          clearInProgress();
          refreshButtons();
          renderResults();
          resultsSection.style.display = "block";
          saveCurrentRecord();
          $("btnNewShift").style.display = "inline-block";
          gpsActionBusy = false;
        };
        navigator.geolocation.getCurrentPosition(pos => {
          finish({ lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() });
        }, () => finish(null), { enableHighAccuracy: true, timeout: 8000 });
      });

      btnResult.addEventListener("click", () => {
        renderResults();
        resultsSection.style.display = resultsSection.style.display === "block" ? "none" : "block";
      });

      $("btnAllRoute").addEventListener("click", () => {
        const link = allRouteLink();
        if (link) window.open(link, "_blank");
        else showAlert("表示できる経路がまだありません。");
      });

      $("btnCsv").addEventListener("click", exportCsv);

      refreshButtons();

      // ---------- 結果表示 ----------
      function renderTimelineInto(container, legsArr, waitsArr) {
        // 走行区間と待機を時系列に並べる
        const items = [];
        legsArr.forEach((l, i) => { items.push({ type: "leg", data: l, idx: i + 1 }); });
        waitsArr.forEach(w => { items.push({ type: "wait", data: w }); });
        items.sort((a, b) => {
          const ta = a.type === "leg" ? a.data.depTime : a.data.startTime;
          const tb = b.type === "leg" ? b.data.depTime : b.data.startTime;
          return ta - tb;
        });

        items.forEach(item => {
          if (item.type === "leg") {
            const l = item.data;
            const dur = l.arrTime - l.depTime;
            const card = document.createElement("div");
            card.className = "leg-card";
            const rlink = routeLink(l.path);
            card.innerHTML = `
          <div class="leg-head">
            <span class="leg-tag">区間 ${item.idx}</span>
            <span class="leg-dur">${fmtDuration(dur)}</span>
          </div>
          <div class="leg-points">
            <div class="point-row"><span class="t mono">${fmtClock(l.depTime)}</span><a href="${pointLink(l.depPoint)}" target="_blank">📍 出発地点を地図で見る</a></div>
            <div class="point-row"><span class="t mono">${fmtClock(l.arrTime)}</span><a href="${pointLink(l.arrPoint)}" target="_blank">🏁 到着地点を地図で見る</a></div>
          </div>
          <div class="leg-foot">${rlink ? `<button class="btn-route" onclick="window.open('${rlink}','_blank')">🗺 経路</button>` : ""}</div>
        `;
            container.appendChild(card);
          } else {
            const w = item.data;
            const dur = w.endTime - w.startTime;
            const card = document.createElement("div");
            card.className = "wait-card";
            card.innerHTML = `
          <div>
            <div class="wait-tag">待機</div>
            <div class="wait-time mono">${fmtClock(w.startTime)} 〜 ${fmtClock(w.endTime)}</div>
          </div>
          <div class="wait-dur mono">${fmtDuration(dur)}</div>
        `;
            container.appendChild(card);
          }
        });
      }

      function renderResults() {
        const timeline = $("timeline");
        timeline.innerHTML = "";

        if (legs.length === 0 && state !== "moving") {
          timeline.innerHTML = '<div class="empty-msg">まだ記録がありません。</div>';
        }

        renderTimelineInto(timeline, legs, waits);

        if (state === "moving") {
          const card = document.createElement("div");
          card.className = "leg-card";
          card.innerHTML = `
        <div class="leg-head"><span class="leg-tag">区間 ${legs.length + 1}<span class="inprogress">進行中</span></span></div>
        <div class="leg-points">
          <div class="point-row"><span class="t mono">${fmtClock(curLegDepTime)}</span><a href="${pointLink(curLegDep)}" target="_blank">📍 出発地点を地図で見る</a></div>
        </div>`;
          timeline.appendChild(card);
        }
        if (state === "waiting") {
          const card = document.createElement("div");
          card.className = "wait-card";
          card.innerHTML = `
        <div><div class="wait-tag">待機中<span class="inprogress">進行中</span></div>
        <div class="wait-time mono">${fmtClock(waitStart)} 〜 -</div></div>
        <div class="wait-dur mono">${fmtDuration(Date.now() - waitStart)}</div>`;
          timeline.appendChild(card);
        }

        // サマリー
        $("sumLegs").textContent = legs.length + (state === "moving" ? " (+1進行中)" : "");
        const totalWait = waits.reduce((s, w) => s + (w.endTime - w.startTime), 0) + (state === "waiting" ? Date.now() - waitStart : 0);
        $("sumWait").textContent = fmtDuration(totalWait);
        $("sumWork").textContent = workStart ? fmtDuration((workEnd || Date.now()) - workStart) : "-";
      }

      // ---------- CSV出力 ----------
      function exportCsvGeneric(legsArr, waitsArr, dateObj) {
        const rows = [["種別", "開始時刻", "終了時刻", "所要時間", "出発地点URL", "到着地点URL", "経路URL"]];
        const items = [];
        legsArr.forEach(l => items.push({ type: "走行", s: l.depTime, e: l.arrTime, dep: l.depPoint, arr: l.arrPoint, path: l.path }));
        waitsArr.forEach(w => items.push({ type: "待機", s: w.startTime, e: w.endTime }));
        items.sort((a, b) => a.s - b.s);
        items.forEach(it => {
          rows.push([
            it.type,
            new Date(it.s).toLocaleString("ja-JP"),
            new Date(it.e).toLocaleString("ja-JP"),
            fmtDuration(it.e - it.s),
            it.dep ? pointLink(it.dep) : "",
            it.arr ? pointLink(it.arr) : "",
            it.path ? (routeLink(it.path) || "") : ""
          ]);
        });
        const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `日報_${dateObj.toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }
      function exportCsv() {
        exportCsvGeneric(legs, waits, new Date());
      }

      // ---------- 外部GPSログの取込（スリープ中の経路欠落を補完） ----------
      // このアプリ自身の走行・待機の「判定」（何時に到着したか等）は変更せず、
      // 既に確定している各走行区間（leg）の depTime〜arrTime の範囲に該当する地点だけを
      // 経路（path）に追加する。取り込んだファイルが対応する外部ロガーの例：
      //   ・Android: GPSLogger for Android（CSV/GPXエクスポート）、Geo Tracker 等
      //   ・iOS: Overland（GeoJSONでエクスポート／CSVではない点に注意）、GPX Tracker、Geo Tracker 等
      // ファイルの中身（拡張子とテキストの先頭）から形式を自動判別するため、
      // 上記に限らずCSV／GPX／GeoJSONであれば概ね取り込める。
      const gpsLogFileInput = $("gpsLogFileInput");
      let gpsImportTarget = null; // "current" または {recordId}

      $("btnImportGpsLog").addEventListener("click", () => {
        if (!(state === "moving" || state === "waiting" || state === "ended")) {
          showAlert("取込先の走行記録がありません。乗務を開始してから行ってください。");
          return;
        }
        gpsImportTarget = "current";
        gpsLogFileInput.value = "";
        gpsLogFileInput.click();
      });
      $("btnRecordImportGpsLog").addEventListener("click", () => {
        if (currentRecordId == null) return;
        gpsImportTarget = { recordId: currentRecordId };
        gpsLogFileInput.value = "";
        gpsLogFileInput.click();
      });

      gpsLogFileInput.addEventListener("change", () => {
        const file = gpsLogFileInput.files && gpsLogFileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const points = parseExternalGpsLog(String(reader.result), file.name);
            if (!points.length) {
              showAlert("ファイルから位置情報を読み取れませんでした。対応形式（CSV／GPX／GeoJSON）かご確認ください。");
              return;
            }
            applyImportedGpsLog(points);
          } catch (e) {
            showAlert("取込に失敗しました：" + (e && e.message ? e.message : "不明なエラー"));
          }
        };
        reader.onerror = () => showAlert("ファイルの読み込みに失敗しました。");
        reader.readAsText(file, "utf-8");
      });

      function applyImportedGpsLog(points) {
        if (gpsImportTarget === "current") {
          const result = mergeGpsLogIntoLegs(legs, points);
          if (state === "moving") {
            // 進行中の区間にも該当する可能性があるため反映
            const tempLeg = { depTime: curLegDepTime, arrTime: Date.now(), path: curLegPath };
            const r2 = mergeGpsLogIntoLegs([tempLeg], points);
            curLegPath = tempLeg.path; // マージ結果を実際の進行中パスへ反映
            result.added += r2.added;
          }
          saveInProgress();
          renderResults();
          showAlert(importSummaryMessage(points.length, result));
        } else if (gpsImportTarget && gpsImportTarget.recordId != null) {
          const recs = loadRecords();
          const rec = recs.find(r => r.id === gpsImportTarget.recordId);
          if (!rec) { showAlert("対象の記録が見つかりませんでした。"); return; }
          const result = mergeGpsLogIntoLegs(rec.legs, points);
          saveRecordsToStorage(recs);
          renderRecordDetail(rec);
          showAlert(importSummaryMessage(points.length, result));
        }
        gpsImportTarget = null;
      }

      function importSummaryMessage(totalPoints, result) {
        if (result.added === 0) {
          return `読み込んだ${totalPoints}件の位置情報のうち、この記録の走行区間の時間帯に該当するものはありませんでした（待機時間中の点は経路には反映されません）。`;
        }
        return `読み込んだ${totalPoints}件の位置情報のうち、${result.added}件を該当する走行区間の経路に追加しました。`;
      }

      // 各leg（depTime〜arrTime）の時間範囲に収まる地点だけをpathへマージする。
      // 既存の点と時間・距離が極めて近い点は重複とみなして追加しない。
      function mergeGpsLogIntoLegs(legsArr, points, toleranceMs) {
        toleranceMs = toleranceMs || 2000;
        const valid = points.filter(p => Number.isFinite(p.t) && Number.isFinite(p.lat) && Number.isFinite(p.lng));
        valid.sort((a, b) => a.t - b.t);
        let added = 0;
        legsArr.forEach(leg => {
          if (!leg.depTime || !leg.arrTime || leg.arrTime <= leg.depTime) return;
          const inRange = valid.filter(p => p.t >= leg.depTime - toleranceMs && p.t <= leg.arrTime + toleranceMs);
          if (!inRange.length) return;
          const merged = (leg.path || []).slice();
          inRange.forEach(p => {
            const isDup = merged.some(e => Math.abs((e.t || 0) - p.t) < 1500 && distanceMeters(e, p) < 5);
            if (!isDup) { merged.push({ lat: p.lat, lng: p.lng, t: p.t }); added++; }
          });
          merged.sort((a, b) => a.t - b.t);
          leg.path = merged;
        });
        return { added };
      }

      // ---------- 外部ファイルの解析（CSV／GPX／GeoJSON 自動判別） ----------
      function parseExternalGpsLog(text, filename) {
        const name = (filename || "").toLowerCase();
        const trimmed = text.replace(/^\uFEFF/, "").trim();
        if (name.endsWith(".gpx") || /^<\?xml/.test(trimmed) || /<gpx[\s>]/i.test(trimmed.slice(0, 200))) {
          return parseGpxLog(trimmed);
        }
        if (name.endsWith(".geojson") || name.endsWith(".json") || trimmed.startsWith("{") || trimmed.startsWith("[")) {
          return parseGeoJsonLog(trimmed);
        }
        return parseCsvLog(trimmed);
      }

      // CSV：ヘッダー名を柔軟に照合する（GPSLogger for Android など、アプリによって
      // 列名・列順が異なるため、代表的な表記ゆれを候補として吸収する）。
      function parseCsvLog(text) {
        const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim().length > 0);
        if (lines.length < 2) return [];
        const splitLine = line => {
          // 簡易的なクォート対応CSVパーサ（フィールド内カンマ・ダブルクォートに対応）
          const out = [];
          let cur = "", inQ = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (inQ) {
              if (c === '"') {
                if (line[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; }
              } else cur += c;
            } else {
              if (c === '"') inQ = true;
              else if (c === ",") { out.push(cur); cur = ""; }
              else cur += c;
            }
          }
          out.push(cur);
          return out.map(s => s.trim());
        };
        const header = splitLine(lines[0]).map(h => h.toLowerCase().replace(/^"|"$/g, ""));
        const findCol = candidates => {
          for (const c of candidates) {
            const i = header.indexOf(c);
            if (i !== -1) return i;
          }
          for (const c of candidates) {
            const i = header.findIndex(h => h.includes(c));
            if (i !== -1) return i;
          }
          return -1;
        };
        const timeCol = findCol(["time", "datetime", "timestamp", "date", "utc", "fix_time", "recorded_at"]);
        const latCol = findCol(["lat", "latitude"]);
        const lngCol = findCol(["lon", "lng", "long", "longitude"]);
        if (latCol === -1 || lngCol === -1 || timeCol === -1) {
          throw new Error("CSVの列（時刻／緯度／経度）を認識できませんでした。");
        }
        const points = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = splitLine(lines[i]);
          if (cols.length <= Math.max(timeCol, latCol, lngCol)) continue;
          const lat = parseFloat(cols[latCol]);
          const lng = parseFloat(cols[lngCol]);
          const t = parseTimeValue(cols[timeCol]);
          if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(t)) {
            points.push({ lat, lng, t });
          }
        }
        return points;
      }

      // GPX：<trkpt lat lon> と 子要素 <time> を読む（多くのAndroid／iOSロガーの標準出力形式）
      function parseGpxLog(text) {
        const doc = new DOMParser().parseFromString(text, "application/xml");
        if (doc.querySelector("parsererror")) throw new Error("GPXの解析に失敗しました。");
        const pts = Array.from(doc.querySelectorAll("trkpt, wpt"));
        const points = [];
        pts.forEach(el => {
          const lat = parseFloat(el.getAttribute("lat"));
          const lng = parseFloat(el.getAttribute("lon"));
          const timeEl = el.querySelector("time");
          const t = timeEl ? parseTimeValue(timeEl.textContent) : NaN;
          if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(t)) {
            points.push({ lat, lng, t });
          }
        });
        return points;
      }

      // GeoJSON：Overland（iOS）などが出力するFeatureCollection形式、または
      // {latitude,longitude,timestamp}等のプレーンな配列の両方に対応する。
      function parseGeoJsonLog(text) {
        const data = JSON.parse(text);
        const points = [];
        const pushFromProps = (lng, lat, props) => {
          props = props || {};
          const timeVal = props.timestamp || props.time || props.date || props.recorded_at;
          const t = parseTimeValue(timeVal);
          if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(t)) {
            points.push({ lat, lng, t });
          }
        };
        if (data && Array.isArray(data.features)) {
          // GeoJSON FeatureCollection（Overlandの標準エクスポート形式）
          data.features.forEach(f => {
            if (f && f.geometry && f.geometry.type === "Point" && Array.isArray(f.geometry.coordinates)) {
              const [lng, lat] = f.geometry.coordinates; // GeoJSONは[経度,緯度]の順
              pushFromProps(lng, lat, f.properties);
            }
          });
        } else if (Array.isArray(data)) {
          // {latitude, longitude, timestamp} 等のプレーンな配列形式
          data.forEach(item => {
            if (!item) return;
            const lat = item.lat ?? item.latitude;
            const lng = item.lng ?? item.lon ?? item.longitude;
            const t = parseTimeValue(item.t ?? item.time ?? item.timestamp ?? item.date);
            if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(t)) {
              points.push({ lat, lng, t });
            }
          });
        } else {
          throw new Error("JSONの形式を認識できませんでした。");
        }
        return points;
      }

      // 時刻文字列／数値をエポックミリ秒に変換する。ISO8601文字列（タイムゾーン付きを含む）と、
      // 秒単位／ミリ秒単位のUNIXエポック数値の両方に対応する。
      function parseTimeValue(v) {
        if (v == null || v === "") return NaN;
        if (typeof v === "number") return v > 1e12 ? v : v * 1000;
        const s = String(v).trim();
        if (/^\d+$/.test(s)) {
          const n = Number(s);
          return n > 1e12 ? n : n * 1000;
        }
        const parsed = Date.parse(s);
        return Number.isFinite(parsed) ? parsed : NaN;
      }

      // ---------- 起動時：進行中の記録があれば復元 ----------
      // OSにタブ／アプリごと終了させられていた場合でも、次に開いた瞬間に
      // localStorageから状態を復元し、壁時計で5分停止ルールを遡って判定する。
      (function initRestore() {
        if (!restoreInProgress()) return;
        showScreen("ride");
        checkArrivalTimeout(); // 離脱していた間に5分以上停止していれば、ここで到着扱いにする
        refreshButtons();
        renderResults();
        resultsSection.style.display = "block";
        requestWakeLockIfPossible();
        gpsNotice.textContent = "前回の記録を復元しました。GPS記録を再開します。";
        handleResumeFix(); // 起動直後に最新位置を取得し、watchPositionも張り直す
      })();

    })();
  </script>
</body>
